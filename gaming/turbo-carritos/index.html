<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(typeof THREE==='undefined'){document.body.innerHTML='<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;background:#2a6bd6;font-size:22px">😕 No se pudo cargar el motor 3D.<br>Revisa la conexión a internet y recarga la página.</div>'}
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const mod=(a,m)=>((a%m)+m)%m;
const wrapA=a=>mod(a+Math.PI,Math.PI*2)-Math.PI;
const isTouch='ontouchstart'in window||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');

// ---------- perfil ----------
const COLORS=[0xff5a5f,0xff9f1c,0xffd23f,0x4fd67a,0x3bb6ff,0xb15cff,0xff70c8,0x2ec4b6,0x2b2b3a,0x9dffd8,0xc9ced8,0xffc928];
const CNAMES=['Rojo','Naranja','Amarillo','Verde','Azul','Morado','Rosa','Turquesa','Negro','Menta','Plata','Dorado'];
const CPRICE=[0,0,0,0,0,0,0,0,40,40,80,150];
const DIFFS=[{name:'Fácil',sk:[.76,.85]},{name:'Normal',sk:[.86,.94]},{name:'Difícil',sk:[.94,1.01]}];
const BOTS=['Toño Turbo','Lola Ligera','Pipo Pedal','Nina Nitro','Rulo Rueda'];
let prof={name:'Jugador',color:0,diff:1,coins:0,races:0,wins:0,best:{},items:true,veh:'carrito',hat:'casco',own:{v:[],h:[],c:[]},ach:{},st:{jumps:0,hits:0,tracks:[]},cups:0,medals:{}};
try{const sv=JSON.parse(localStorage.getItem('tc_prof')||'{}');Object.assign(prof,sv);prof.own=Object.assign({v:[],h:[],c:[]},sv.own||{});prof.st=Object.assign({jumps:0,hits:0,tracks:[]},sv.st||{});prof.ach=sv.ach||{};prof.medals=sv.medals||{}}catch(e){}
const owns={v:k=>VEH[k]&&(VEH[k].price===0||prof.own.v.includes(k)),h:k=>{const h=HATS.find(x=>x.id===k);return !!h&&(h.price===0||prof.own.h.includes(k))},c:i=>CPRICE[i]===0||prof.own.c.includes(i)};
// en el garaje se puede probar algo antes de comprarlo
let tryOn=null;
function myLook(){const t=tryOn||{};return{veh:t.veh||prof.veh,hat:t.hat||prof.hat,color:COLORS[t.color!=null?t.color:prof.color]}}
function saveProf(){try{localStorage.setItem('tc_prof',JSON.stringify(prof))}catch(e){}}
let cfg={music:true,snd:true,q:isTouch?'media':'alta'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('tc_cfg')||'{}'))}catch(e){}
function saveCfg(){try{localStorage.setItem('tc_cfg',JSON.stringify(cfg))}catch(e){}}
function toast(html){const d=document.createElement('div');d.className='toast';d.innerHTML=html;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3000)}

// ---------- audio ----------
let AC=null,musT=null,musStep=0,eng=null;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(cfg.music)startMusic()}
function tone(f,d,type,v,slide,when){if(!AC)return;const t=AC.currentTime+(when||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const midi=n=>440*Math.pow(2,(n-69)/12);
function sfx(k){
  if(!AC||!cfg.snd)return;
  const T=(f,d,ty,v,s,w)=>tone(f,d,ty||'square',v||.07,s||0,w||0);
  if(k==='beep')T(660,.2,'square',.07);
  else if(k==='go')T(990,.5,'square',.08);
  else if(k==='coin'){T(988,.07,'square',.05);T(1319,.18,'square',.05,0,.07)}
  else if(k==='boost'){T(300,.5,'sawtooth',.05,900);T(150,.4,'triangle',.08,300)}
  else if(k==='bump')T(140,.18,'triangle',.13,-60);
  else if(k==='wall')T(90,.2,'sawtooth',.06,-30);
  else if(k==='lap')[76,79,84].forEach((n,i)=>T(midi(n),.16,'square',.06,0,i*.1));
  else if(k==='win')[72,76,79,84,88].forEach((n,i)=>T(midi(n),.25,'square',.07,0,i*.12));
  else if(k==='lose')[67,64,60].forEach((n,i)=>T(midi(n),.3,'triangle',.1,0,i*.16));
  else if(k==='spark1')T(1200,.08,'square',.03);
  else if(k==='spark2')T(1600,.1,'square',.035);
  else if(k==='hop')T(400,.1,'square',.03,200);
  else if(k==='roll')T(1100+Math.random()*500,.05,'square',.025);
  else if(k==='item')[84,88,91].forEach((n,i)=>T(midi(n),.1,'square',.05,0,i*.06));
  else if(k==='throw')T(700,.25,'sine',.09,-450);
  else if(k==='splash'){T(400,.35,'sawtooth',.06,-330);T(160,.4,'triangle',.12,-90)}
  else if(k==='pop')T(900,.15,'sine',.09,700);
  else if(k==='hit')[79,84].forEach((n,i)=>T(midi(n),.12,'square',.06,0,i*.08));
  else if(k==='rocket'){T(180,1.4,'sawtooth',.06,700);T(90,1,'triangle',.1,200)}
  else if(k==='shield')T(500,.35,'sine',.07,500);
  else if(k==='magnet')[0,1,2].forEach(i=>T(300+i*150,.15,'square',.04,100,i*.08));
  else if(k==='soap')T(250,.3,'sine',.08,300);
}
function speak(t){if(!cfg.snd||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=1.05;u.pitch=1.5;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const SONGS={
  jardin:{ms:120,w:'square',v:.022,mel:[76,0,76,79,81,0,79,76,74,0,74,76,79,0,76,74,72,0,72,74,76,0,79,81,79,76,74,72,74,0,0,0],bas:[48,48,48,48,53,53,55,55,50,50,50,50,55,55,55,55,48,48,48,48,53,53,57,57,55,55,55,55,43,43,43,43]},

function trackQuery(c){
  let best=1e9,bi=c.idx;
  const win=Math.abs(c.lat||0)>W/2+WALL-2?70:25;
  for(let k=-win;k<=win;k++){const i=mod(c.idx+k,N),p=TP[i],dx=c.x-p.x,dz=c.z-p.z,d=dx*dx+dz*dz;if(d<best){best=d;bi=i}}
  let dl=bi-c.idx;if(dl>N/2)dl-=N;if(dl<-N/2)dl+=N;c.s+=dl;c.idx=bi;
  const p=TP[bi],n=TN[bi],t=TT[bi],dx=c.x-p.x,dz=c.z-p.z;
  c.lat=dx*n.x+dz*n.z;
  const al=clamp((dx*t.x+dz*t.z)/SEG,-1,1),q=TP[(bi+1)%N],o=TP[mod(bi-1,N)];
  c.frac=al;c.gy=(q.y-o.y)/(2*SEG);c.y=p.y+c.gy*al*SEG;
}

// ---------- objetos ----------
function giveItem(c){
  if(c.item||c.roll>0||!itemsOn())return;
  const pl=ranking().indexOf(c)+1,w=IW[pl<=1?0:pl<=3?1:pl<=5?2:3];
  let tot=0;for(const k of IKEYS)tot+=w[k];let r=Math.random()*tot,pick='balloon';
  for(const k of IKEYS){r-=w[k];if(r<0){pick=k;break}}
  c.rollItem=pick;c.roll=c.isP?.9:.3;
  c.useT=pick==='rocket'||pick==='magnet'?rnd(.6,2):pick==='shield'?rnd(1,4):pick==='balloon'?rnd(7,11):rnd(6,12);
}
function useItem(c){
  const it=c.item;if(!it||c.spin>0)return;c.item=null;
  const fx=Math.sin(c.h),fz=Math.cos(c.h),near=c.isP||((c.x-P.x)**2+(c.z-P.z)**2<1600);
  if(it==='soap'){const m=new THREE.Mesh(soapGeo,soapMat);m.scale.set(1,.4,1);m.position.set(c.x-fx*3,c.y+.4,c.z-fz*3);scene.add(m);hazards.push({type:'soap',m,owner:c,ownT:.8,life:25,wob:0});if(near)sfx('soap')}
  else if(it==='balloon'){const dir=Math.cos(wrapA(c.h-TH[c.idx]))>=0?1:-1;const m=new THREE.Mesh(balGeo,balMat);m.scale.set(1,1.15,1);scene.add(m);
    hazards.push({type:'balloon',m,owner:c,ownT:.4,life:2.6,s:c.s+c.frac+dir*2.5,lat:c.lat,dir,y0:c.y});if(near)sfx('throw')}
  else if(it==='rocket'){c.rocket=2.4;boost(c,2.4);if(near)sfx('rocket')}
  else if(it==='magnet'){c.magnet=7;if(c.isP)sfx('magnet')}
  else if(it==='shield'){c.shield=12;if(near)sfx('shield')}
}
function spin(c,by){
  if(c.spin>0||c.rocket>0)return;
  const near=c.isP||((c.x-P.x)**2+(c.z-P.z)**2<1600);
  if(c.shield>0){c.shield=0;if(near){sfx('pop');for(let i=0;i<10;i++)spawn(c.x,c.y+1.5,c.z,rnd(-5,5),rnd(1,5),rnd(-5,5),0x9fe3ff,.5,1.1)}if(c.isP){toast('🛡️ ¡El escudo te ha salvado!');unlock('escudo')}return}
  if(c.isP&&Math.random()<.5&&G.t-(G.vT||0)>4){speak(pick(['¡Ay!','¡Uy, qué resbalón!','¡Me han pillado!','¡Vaya trompo!']));G.vT=G.t}
  c.spin=1.1;c.spd*=.4;c.drifting=false;c.lvl=0;c.boost=0;
  if(near)for(let i=0;i<14;i++)spawn(c.x,c.y+1.4,c.z,rnd(-5,5),rnd(2,6),rnd(-5,5),Math.random()<.6?0x3bb6ff:0xffffff,.6,1.2);
  if(c.isP){sfx('splash');G.shake=.45;bigMsg('¡Plaf!',.9);G.wasHit=true}
  else if(by&&by.isP){sfx('hit');G.hits++;prof.st.hits++;if(prof.st.hits>=10)unlock('globo');toast('🎯 ¡Le diste a '+esc(c.name)+'!')}
}
function updItems(dt){
  // cajas
  for(const b of iboxes){
    if(!itemsOn()){b.m.visible=false;continue}
    if(!b.m.visible){b.t-=dt;if(b.t<=0){b.m.visible=true;b.m.scale.setScalar(.01)}continue}
    if(b.m.scale.x<1)b.m.scale.setScalar(Math.min(1,b.m.scale.x+dt*2.5));
    b.ph+=dt;b.m.rotation.y+=dt*1.5;b.m.position.y=b.y+Math.sin(b.ph*2.5)*.25;
    for(const c of cars){const dx=c.x-b.m.position.x,dz=c.z-b.m.position.z;if(dx*dx+dz*dz<5.3){b.m.visible=false;b.t=3;giveItem(c);
      if(c.isP||((c.x-P.x)**2+(c.z-P.z)**2<900))for(let i=0;i<8;i++)spawn(b.m.position.x,b.m.position.y,b.m.position.z,rnd(-4,4),rnd(1,4),rnd(-4,4),[0xff5a8a,0xffd23f,0x3bb6ff][i%3],.45);break}}
  }
  // ruleta y uso por los rivales
  for(const c of cars){
    if(c.roll>0){c.roll-=dt;if(c.isP&&Math.random()<.4)sfx('roll');if(c.roll<=0){c.item=c.rollItem;if(c.isP)sfx('item')}}
    c.rocket=Math.max(0,c.rocket-dt);c.shield=Math.max(0,c.shield-dt);c.magnet=Math.max(0,c.magnet-dt);
    if(c.rocket>0)c.boost=Math.max(c.boost,.15);
    if(c.isP&&!G.auto&&G.state!=='finish'&&G.state!=='results')continue;
    if(!c.item)continue;
    c.useT-=dt;let use=c.useT<=0;const cs=c.s+c.frac;
    if(c.item==='balloon')for(const o of cars){if(o===c)continue;const ds=o.s+o.frac-cs;if(ds>3&&ds<32&&Math.abs(o.lat-c.lat)<4){use=true;break}}
    if(c.item==='soap')for(const o of cars){if(o===c)continue;const ds=cs-(o.s+o.frac);if(ds>2&&ds<14&&Math.abs(o.lat-c.lat)<5){use=true;break}}
    if(use)useItem(c);
  }
  // peligros
  for(let k=hazards.length-1;k>=0;k--){const h=hazards[k];h.life-=dt;h.ownT-=dt;
    if(h.type==='soap'){h.wob+=dt;h.m.scale.set(1+Math.sin(h.wob*4)*.06,.4+Math.sin(h.wob*5)*.04,1+Math.cos(h.wob*4)*.06)}
    else{
      h.s+=h.dir*50/SEG*dt;
      let tgt=null,bd=40;for(const o of cars){if(o===h.owner)continue;const ds=(o.s+o.frac-h.s)*h.dir;if(ds>0&&ds<bd){bd=ds;tgt=o}}
      if(tgt)h.lat+=clamp(tgt.lat-h.lat,-9*dt,9*dt);
      const si=mod(h.s,N),i=Math.floor(si),f=si-i,a=TP[i],b=TP[(i+1)%N],n=TN[i];
      h.m.position.set(a.x+(b.x-a.x)*f+n.x*h.lat,a.y+(b.y-a.y)*f+1.2+Math.abs(Math.sin(h.life*9))*.6,a.z+(b.z-a.z)*f+n.z*h.lat);
      h.m.rotation.y+=dt*6;
    }
    let hit=false;
    for(const c of cars){if(c===h.owner&&h.ownT>0)continue;const dx=c.x-h.m.position.x,dz=c.z-h.m.position.z,r=h.type==='soap'?4.6:5.2;
      if(dx*dx+dz*dz<r&&c.hy<1.6){spin(c,h.owner);hit=true;break}}
    if(hit||h.life<=0){if(h.type==='balloon'&&!hit)for(let i=0;i<8;i++)spawn(h.m.position.x,h.m.position.y,h.m.position.z,rnd(-4,4),rnd(1,4),rnd(-4,4),0x3bb6ff,.5);scene.remove(h.m);hazards.splice(k,1)}
  }
}

function boost(c,t){c.boost=Math.max(c.boost,t);c.spd=Math.max(c.spd,Math.min(c.spd+5,c.maxSpd*1.3));if(c.isP){sfx('boost');G.kick=1}}

function aiInput(c,dt){
  const look=Math.round(9+Math.abs(c.spd)*.38);const ti=(c.idx+look)%N,tp=TP[ti],n=TN[ti];
  c.laneT-=dt;if(c.laneT<0){c.lane=rnd(-W*.28,W*.28);c.laneT=rnd(2,5)}
  // ir a por placas turbo cercanas
  for(const pd of PADS){let d=pd.i-c.idx;if(d<0)d+=N;if(d<45&&d>3){c.lane=pd.lat;break}}
  let tx=tp.x+n.x*c.lane,tz=tp.z+n.z*c.lane;
  if(SHORT){const S=SHORT;let da=S.a-c.idx;if(da<0)da+=N;
    if(da>0&&da<30&&c.shortLap!==c.lapMax){c.shortLap=c.lapMax;c.useShort=Math.random()<(c.veh==='cesped'?.9:.35)}
    if(c.useShort){const t=(c.x-S.ax)*S.ux+(c.z-S.az)*S.uz;
      if(c.idx<S.a-32||c.idx>S.b-2||t>S.L-3)c.useShort=false;
      else{const tt=clamp(t+8+c.spd*.35,5,S.L);tx=S.ax+S.ux*tt;tz=S.az+S.uz*tt}}}
  const hd=Math.atan2(tx-c.x,tz-c.z),diff=wrapA(hd-c.h);
  const curv=Math.abs(wrapA(TH[(c.idx+35)%N]-TH[c.idx]));
  let tgt=c.useShort?Math.min(c.maxSpd,c.inCorr?c.offMax+9:c.maxSpd):c.maxSpd*(1-.3*clamp(curv/1.3,0,1));
  if(!c.isP&&P){const gap=P.s-c.s;tgt*=1+clamp(gap/260,-1,1)*.08}
  c.aiBoostT-=dt;if(c.aiBoostT<0){c.aiBoostT=rnd(6,12)/(c.skill||1);if(curv>.25||Math.random()<.4)boost(c,.5+.5*(c.skill||1))}
  return {steer:clamp(-diff*2.6,-1,1),acc:c.spd<tgt,brake:c.spd>tgt+5,drift:false};
}
function playerInput(){
  if(G.auto||G.state==='finish'||G.state==='results')return aiInput(P,1/60);
  let steer=T.steer;if(keys.ArrowLeft||keys.KeyA)steer-=1;if(keys.ArrowRight||keys.KeyD)steer+=1;
  const brake=!!(keys.ArrowDown||keys.KeyS||T.brake);
  const acc=!!(keys.ArrowUp||keys.KeyW||(isTouch&&!brake));
  return {steer:clamp(steer,-1,1),acc,brake,drift:!!(keys.Space||keys.ShiftLeft||keys.ShiftRight||T.drift)};
}

function physics(c,inp,dt){
  const off=Math.abs(c.lat)>W/2+.6;
  if(c.spin>0){c.spin-=dt;inp={steer:0,acc:false,brake:false,drift:false};c.spinA=c.spin>0?(1-c.spin/1.1)*Math.PI*4:0}
  c.steer+=(inp.steer-c.steer)*Math.min(1,dt*10);
  let max=(c.maxSpd+Math.min(c.coins,10)*.2)*(c.boost>0?(c.rocket>0?1.5:1.32):1);
  const cr0=off&&SHORT?corridor(c.x,c.z):null;c.inCorr=!!(cr0&&cr0.d<CORR+.3);
  if(off&&c.boost<=0)max=Math.min(max,c.inCorr?c.offMax+9:c.offMax);
  if(inp.acc&&c.spd<max)c.spd+=(c.boost>0?34:c.acc)*dt;
  if(c.spd>max)c.spd=Math.max(max,c.spd-22*dt);
  if(inp.brake){if(c.spd>0)c.spd=Math.max(0,c.spd-(c.spin>0?14:32)*dt);else c.spd=Math.max(-8,c.spd-9*dt)}
  if(!inp.acc&&!inp.brake)c.spd-=Math.sign(c.spd)*Math.min(Math.abs(c.spd),5*dt);
  const sf=Math.min(1,Math.abs(c.spd)/6)*(c.spd<0?-1:1);
  let turn=c.steer*2.05*c.turnK*sf*(1-.22*Math.min(1,Math.abs(c.spd)/30));
  // derrape
  if(inp.drift&&!c.drifting&&Math.abs(inp.steer)>.3&&c.spd>11&&c.hy<=0){c.drifting=true;c.ddir=Math.sign(inp.steer);c.charge=0;c.lvl=0;c.vy=4.5;if(c.isP)sfx('hop')}
  if(c.drifting){
    if(!inp.drift||c.spd<7){if(c.lvl)boost(c,c.lvl===2?1.35:.75);c.drifting=false;c.lvl=0}
    else{turn=c.ddir*(1.15+.55*clamp(inp.steer*c.ddir,-1,1))*1.05*(.5+.5*c.turnK);c.charge+=dt*(off?.35:1)*c.dch;
      const nl=c.charge>1.7?2:c.charge>.75?1:0;if(nl>c.lvl){c.lvl=nl;if(c.isP){sfx(nl===2?'spark2':'spark1');if(nl===2)unlock('derrape')}}}
  }
  if(c.hy>0&&!c.drifting)turn*=.6;
  c.h-=turn*dt;
  c.x+=Math.sin(c.h)*c.spd*dt;c.z+=Math.cos(c.h)*c.spd*dt;
  // salto pequeño
  c.vy-=26*dt;c.hy+=c.vy*dt;if(c.hy<0){c.hy=0;c.vy=0;if(c.jump){c.jump=false;boost(c,.6);if(c.isP){prof.st.jumps++;if(prof.st.jumps>=10)unlock('salto');bigMsg('¡Salto turbo!',.9);G.shake=.2;for(let i=0;i<10;i++)spawn(c.x+rnd(-1.5,1.5),c.y+.2,c.z+rnd(-1.5,1.5),rnd(-3,3),rnd(1,3),rnd(-3,3),0xffffff,.5)}}}
  c.boost=Math.max(0,c.boost-dt);c.bumpT-=dt;c.wallT-=dt;c.padT-=dt;
  trackQuery(c);
  // rampas
  let ry=0;for(const r of RAMPS){let d=c.idx+c.frac-r.i;if(d<-N/2)d+=N;if(d>=0&&d<=5&&Math.abs(c.lat)<W/2+.5){ry=1.4*d/5;break}}
  if(c.hy<ry){c.hy=ry;if(c.vy<0)c.vy=0}
  if(c.ry>.9&&ry===0&&!c.jump&&c.hy<c.ry+.3&&c.spd>8&&Math.cos(wrapA(c.h-TH[c.idx]))>0){c.vy=5+c.spd*.16;c.jump=true;if(c.isP)sfx('hop')}
  c.ry=ry;
  if(c.isP&&c.inCorr)unlock('atajo');
  const lim=W/2+WALL-.9;
  const cr2=Math.abs(c.lat)>lim&&SHORT?corridor(c.x,c.z):null;
  if(cr2&&cr2.d<CORR){}
  else if(cr2&&cr2.d<CORR+6&&cr2.t>.02&&cr2.t<.98){const k=(cr2.d-CORR+.05)/cr2.d;c.x+=(cr2.cx-c.x)*k;c.z+=(cr2.cz-c.z)*k;if(c.wallT<=0){c.spd*=.8;c.wallT=.4;if(c.isP)sfx('wall')}}
  else if(Math.abs(c.lat)>lim){const n=TN[c.idx],ex=(Math.abs(c.lat)-lim)*Math.sign(c.lat);c.x-=n.x*ex;c.z-=n.z*ex;c.lat-=ex;
    const fwd=Math.cos(wrapA(c.h-TH[c.idx]))>=0;c.h=c.h+wrapA((fwd?TH[c.idx]:TH[c.idx]+Math.PI)-c.h)*.35;
    if(c.wallT<=0){c.spd*=.62;c.wallT=.4;if(c.isP){sfx('wall');G.shake=.3}}}
  // placas turbo
  if(c.padT<=0)for(const pd of PADS){let d=c.idx-pd.i;if(d<0)d+=N;if(d<=5&&Math.abs(c.lat-pd.lat)<3.4){boost(c,1.1);c.padT=.6;break}}
  // vueltas
  const lap=Math.floor(c.s/N);
  if(lap>c.lapMax){c.lapMax=lap;
    if(c.isP&&lap>=1)(c.lapTimes=c.lapTimes||[]).push(G.t);
    if(lap>=LAPS&&!c.finished){c.finished=true;c.finT=G.t;if(c.isP)playerFinish()}
    else if(c.isP&&lap>=1){sfx('lap');if(G.mode==='tt'&&c.lapTimes.length>=1){const lt=c.lapTimes,d=lt[lt.length-1]-(lt[lt.length-2]||0);toast('⏱️ Vuelta '+lap+': <b>'+fmt(d)+'</b>')}if(lap===LAPS-1){bigMsg('¡Última vuelta!',1.6);speak('¡Última vuelta!');musFast=1.18}else bigMsg('Vuelta '+(lap+1),1.2)}}
}

function collide(){
  for(let a=0;a<cars.length;a++)for(let b=a+1;b<cars.length;b++){const A=cars[a],B=cars[b];const dx=B.x-A.x,dz=B.z-A.z,d2=dx*dx+dz*dz;
    if(d2<5.3&&d2>1e-4){const d=Math.sqrt(d2),o=2.3-d,nx=dx/d,nz=dz/d,wa=B.mass/(A.mass+B.mass),wb=1-wa;A.x-=nx*o*wa;A.z-=nz*o*wa;B.x+=nx*o*wb;B.z+=nz*o*wb;
      const dv=(A.spd-B.spd)*.5;A.spd-=dv*wa;B.spd+=dv*wb;
      if(A.rocket>0&&B.rocket<=0)spin(B,A);else if(B.rocket>0&&A.rocket<=0)spin(A,B);
      if((A.isP||B.isP)&&A.bumpT<=0&&B.bumpT<=0){sfx('bump');A.bumpT=B.bumpT=.4;const m=P;spawnStars(m.x+nx*(A.isP?1:-1),m.y+1.5,m.z+nz*(A.isP?1:-1))}}}
}
function spawnStars(x,y,z){for(let i=0;i<6;i++)spawn(x,y,z,rnd(-4,4),rnd(2,5),rnd(-4,4),0xffe14d,.5,1.2)}

function updCoins(dt){

  }
}

function updMesh(c,dt){
  const m=c.mesh,u=m.userData;
  const yt=c.h-(c.drifting?c.ddir*-.42:0);
  c.yaw+=wrapA(yt-c.yaw)*Math.min(1,dt*12);
  m.position.set(c.x,c.y+c.hy,c.z);m.rotation.y=c.yaw+c.spinA;
  if(u.flames)for(const f of u.flames)f.scale.set(1,c.boost>0?rnd(1.4,2.2):rnd(.5,.9),1);
  if(u.driver.userData.bob)u.driver.userData.bob.position.y=1.45+Math.sin(G.t*9+c.idx)*.06*Math.min(1,c.spd/10);
  u.rocket.visible=c.rocket>0;if(c.rocket>0)u.flame.scale.set(1,rnd(.7,1.4),1);
  u.shield.visible=c.shield>0;if(c.shield>0){const s=1+Math.sin(G.t*6)*.04;u.shield.scale.setScalar(s);u.shield.material.opacity=c.shield<2&&Math.sin(G.t*20)>0?.1:.28}
  const slope=c.gy*Math.cos(wrapA(c.h-TH[c.idx]));m.rotation.x=-Math.atan(slope)-(c.ry>0&&c.hy<=c.ry+.05?Math.atan(1.4/(5*SEG)):0)-(c.jump?clamp(c.vy*.03,-.3,.3):0);
  u.body.rotation.z+=((c.drifting?c.ddir*.12:c.steer*.06*Math.min(1,c.spd/20))-u.body.rotation.z)*Math.min(1,dt*8);
  u.driver.rotation.y=-c.steer*.35;
  for(const w of u.wheels)w.rotation.x+=c.spd*dt/.34;
  u.wheels[0].rotation.y=u.wheels[1].rotation.y=-c.steer*.4;
  // efectos
  const fx=Math.sin(c.h),fz=Math.cos(c.h),rx=-Math.cos(c.h),rz=Math.sin(c.h);
  const near=c.isP||((c.x-P.x)**2+(c.z-P.z)**2<900);
  if(!near)return;
  if(c.drifting&&c.charge>.2){const col=c.lvl===2?0xff9a1a:c.lvl===1?0x7fd0ff:0xffffff;for(const sd of [-1,1])if(Math.random()<.7)spawn(c.x-fx*1.1+rx*sd*.8,c.y+.3,c.z-fz*1.1+rz*sd*.8,rnd(-1.5,1.5)-fx*2,rnd(1,3),rnd(-1.5,1.5)-fz*2,col,.3,.9)}
  if(c.boost>0&&Math.random()<.8)spawn(c.x-fx*1.6,c.y+.8,c.z-fz*1.6,-fx*6+rnd(-1,1),rnd(0,1),-fz*6+rnd(-1,1),Math.random()<.5?0xff9a1a:0xffe14d,.3,1.3);
  if(Math.abs(c.lat)>W/2+.6&&c.spd>6&&Math.random()<.5)spawn(c.x-fx*1.2+rx*rnd(-.8,.8),c.y+.2,c.z-fz*1.2+rz*rnd(-.8,.8),rnd(-1,1),rnd(1.5,3),rnd(-1,1),Math.random()<.5?0x4c9a32:0x8a6a3a,.5,1);
}

const camT=new THREE.Vector3(),look=new THREE.Vector3();
G.shake=0;G.kick=0;
function updCam(dt,snap){
  if(!P)return;

  }else if(G.state==='race'||G.state==='finish'||G.state==='results'){
    if(G.state!=='results')G.t+=dt;
    for(const c of cars){if(c.finished&&!c.isP&&G.state!=='results'){physics(c,{steer:aiInput(c,dt).steer,acc:false,brake:false,drift:false},dt)}else physics(c,c.isP?playerInput():aiInput(c,dt),dt)}
    collide();updCoins(dt);updItems(dt);for(const c of cars)updMesh(c,dt);updGhost();
    if(G.state==='finish'){G.fin-=dt;if(G.fin<=0)showResults()}
  }else if(G.state==='menu'||G.state==='garage'){for(const c of cars)updMesh(c,dt)}
  else if(G.state==='podium'){for(const c of cars)updMesh(c,dt);if(Math.random()<.6){const q=G.pod;spawn(q.lx+rnd(-8,8),q.ly+10,q.lz+rnd(-8,8),rnd(-1,1),rnd(-1,1),rnd(-1,1),[0xff5a8a,0xffd23f,0x3bb6ff,0x4fd67a,0xb15cff][Math.floor(Math.random()*5)],2.2,1)}}
  padTex();updParts(dt);updCam(dt);
  if(G.state==='race'||G.state==='count'||G.state==='finish'){updHUD(dt);engineUpd(P.spd,P.boost>0,G.state!=='finish')}
}
function padTex(){texPad.offset.y-=.03}
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);R.render(scene,cam);
  if(G.state==='race'&&!downgraded){fpsAcc+=dt;fpsN++;if(fpsAcc>4){if(fpsAcc/fpsN>1/34&&cfg.q!=='baja'){cfg.q=cfg.q==='alta'?'media':'baja';saveCfg();applyQ();updBtns();toast('⚙️ Calidad bajada a '+cfg.q+' para ir más fluido');downgraded=true}fpsAcc=0;fpsN=0}}
  requestAnimationFrame(loop);
}

// ---------- controles ----------
function playerUse(){if(G.state==='race'&&P&&!G.auto)useItem(P)}
addEventListener('keydown',e=>{if((e.code==='KeyE'||e.code==='KeyX')&&!e.repeat&&e.target.tagName!=='INPUT')playerUse();keys[e.code]=true;if(e.code==='Escape'||e.code==='KeyP')togglePause();if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)&&e.target.tagName!=='INPUT')e.preventDefault();
  if(e.code==='Enter'&&G.state==='menu'&&e.target.tagName!=='INPUT')$('play').click()});
addEventListener('keyup',e=>{keys[e.code]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(G.state==='race'||G.state==='count'))togglePause()});
{const pad=$('pad'),knob=$('knob');let pid=null;
 const set=e=>{const r=pad.getBoundingClientRect();const v=clamp((e.clientX-(r.left+r.width/2))/(r.width*.36),-1,1);T.steer=Math.abs(v)<.08?0:v;knob.style.transform=`translateX(${v*r.width*.36}px)`};
 pad.addEventListener('pointerdown',e=>{pid=e.pointerId;try{pad.setPointerCapture(pid)}catch(_){}set(e);e.preventDefault()});
 pad.addEventListener('pointermove',e=>{if(e.pointerId===pid)set(e)});
 const up=e=>{if(e.pointerId!==pid)return;pid=null;T.steer=0;knob.style.transform=''};
 pad.addEventListener('pointerup',up);pad.addEventListener('pointercancel',up);
 for(const [id,k] of [['tD','drift'],['tB','brake']]){const b=$(id);
  b.addEventListener('pointerdown',e=>{T[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
  const off=()=>{T[k]=false;b.classList.remove('on')};b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off)}}
$('pauseB').addEventListener('click',togglePause);
$('item').addEventListener('pointerdown',e=>{e.preventDefault();playerUse()});
$('resume').onclick=togglePause;
$('restart').onclick=()=>{$('pause').classList.remove('on');startRace()};
$('quit').onclick=toMenu;
$('again').onclick=againAct;
$('toMenu').onclick=toMenu;
$('play').onclick=()=>{if(G.mode==='cup')startCup();else startRace()};
$('achB').onclick=()=>{buildAch();$('menu').classList.remove('on');$('achOv').classList.add('on')};
$('achX').onclick=()=>{$('achOv').classList.remove('on');$('menu').classList.add('on')};
$('pMenu').onclick=toMenu;
$('musB').onclick=()=>{cfg.music=!cfg.music;saveCfg();if(cfg.music){initAudio();startMusic()}else stopMusic();updBtns()};
$('sndB').onclick=()=>{cfg.snd=!cfg.snd;saveCfg();updBtns()};
$('qB').onclick=()=>{cfg.q=cfg.q==='alta'?'media':cfg.q==='media'?'baja':'alta';saveCfg();applyQ();updBtns()};

function buildMenu(){
  $('mCoins').textContent='🪙 '+prof.coins;
  $('name').value=prof.name;
  const hv=HATS.find(h=>h.id===prof.hat)||HATS[0];
  $('myKart').innerHTML=`${VEH[prof.veh].ic} <b>${VEH[prof.veh].name}</b> · ${hv.ic} ${hv.name} · <span class="dot" style="background:${hex(COLORS[prof.color])}"></span> ${CNAMES[prof.color]}`;
  $('diffs').innerHTML=DIFFS.map((d,i)=>`<div class="chip${i===prof.diff?' on':''}" data-i="${i}">${d.name}</div>`).join('');
  $('diffs').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{prof.diff=+el.dataset.i;saveProf();buildMenu()});
  $('modes').innerHTML=MODES.map(([k,t])=>`<div class="chip${G.mode===k?' on':''}" data-k="${k}">${t}</div>`).join('');
  $('modes').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{G.mode=el.dataset.k;prof.mode=G.mode;saveProf();if(G.mode==='cup'&&TRK!==TKEYS[0]){buildTrack(TKEYS[0])}setupGrid();buildMenu()});
  $('modeTxt').textContent=G.mode==='cup'?'4 carreras seguidas: '+TKEYS.map(k=>TRACKS[k].ic).join(' → ')+'. Puntos: 10-7-5-3-2-1. ¡Premio para el podio!':G.mode==='tt'?'Tú solo contra el reloj y tu fantasma, sin objetos. ¡Consigue medallas!':'Una carrera contra 5 rivales.';
  $('play').textContent=G.mode==='cup'?'¡EMPEZAR COPA!':G.mode==='tt'?'¡CONTRARRELOJ!':'¡A CORRER!';
  $('trackCard').style.display=G.mode==='cup'?'none':'';
  $('tracks').innerHTML=TKEYS.map(k=>{let sub;if(G.mode==='tt'){const gh=loadGhost(k);sub=(MEDAL_ICON[prof.medals[k]||0]||'')+' '+(gh?'⏱️ '+fmt(gh.t):'sin tiempo')}else sub=prof.best[k]?'⏱️ '+fmt(prof.best[k]):'sin récord';
    return `<div class="chip trk${k===TRK?' on':''}" data-k="${k}">${TRACKS[k].ic} ${TRACKS[k].name}<br><small>${sub}</small></div>`}).join('');
  $('tracks').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{if(el.dataset.k===TRK)return;prof.track=el.dataset.k;saveProf();buildTrack(prof.track);setupGrid();buildMenu();updCam(0,true)});
  $('achB').textContent=`🏆 Logros ${ACH.filter(a=>prof.ach[a[0]]).length}/${ACH.length}`;
  $('itemsOpt').innerHTML=['Sí','No'].map((t,i)=>`<div class="chip${(i===0)===!!prof.items?' on':''}" data-i="${i}">${t}</div>`).join('');
  $('itemsOpt').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{prof.items=el.dataset.i==='0';saveProf();buildMenu();setupGrid()});
  $('howto').innerHTML=(isTouch?'<p>🚀 El carrito acelera solo. Desliza el dedo en la barra de la izquierda para girar. ✋ frena.</p><p>💨 <b>Mantén</b> el botón de derrape mientras giras: chispas blancas → azules → naranjas. ¡Suéltalo para un turbo!</p>':'<p>⬆️ acelerar · ⬇️ frenar · ⬅️➡️ girar · Esc pausa</p><p>💨 <b>Mantén Espacio</b> mientras giras para derrapar: chispas blancas → azules → naranjas. ¡Suéltalo para un turbo!</p>')+'<p>🟧 Las placas naranjas dan turbo. 🪙 Cada moneda (hasta 10) te hace un poco más rápido. 🌿 El césped frena.</p><p>🟨 Las rampas amarillas te hacen saltar: ¡al aterrizar recibes un turbo! 🪧 Busca el cartel de <b>¡ATAJO!</b>: el camino de tierra es más corto, pero más lento (¡el cortacésped va genial por ahí!).</p><p>🛒 Con las monedas compra vehículos, pinturas y gorros en el <b>Garaje</b>. En la tienda, toca una vez para probarlo y otra para comprarlo.</p><p>❓ Pasa por las cajas de colores para conseguir un objeto y úsalo con '+(isTouch?'el botón del objeto':'<b>E</b>')+': 🫧 pompa de jabón (la dejas detrás), 🎈 globo de agua (va a por el de delante), 🚀 cohete de botella (superturbo), 🧲 imán de monedas y 🛡️ escudo-burbuja.</p>';
  $('stats').textContent=`Carreras: ${prof.races} · Victorias: ${prof.wins} · Copas: ${prof.cups||0}`;
  updBtns();
}


// ---------- garaje y tienda ----------
const hex=c=>'#'+c.toString(16).padStart(6,'0');
let gTab='v',gAsk=null;
function openGarage(){initAudio();G.state='garage';tryOn=null;gAsk=null;$('menu').classList.remove('on');$('garage').classList.add('on');buildGarage();setupGrid();updCam(0,true)}
function closeGarage(){tryOn=null;gAsk=null;$('garage').classList.remove('on');G.state='menu';cam.clearViewOffset();setupGrid();buildMenu();$('menu').classList.add('on')}
function statBars(k){const v=VEH[k],r=(x,a,b)=>clamp(Math.round(1+4*(x-a)/(b-a)),1,5);
  const rows=[['Velocidad',r(v.spd,27.4,30)],['Aceleración',r(v.acc,10.5,16)],['Giro',r(v.turn,.88,1.15)],['Peso',r(v.mass,.8,1.6)],['Por el césped',v.off>13?5:2]];
  return '<div class="bars">'+rows.map(([n,x])=>`<span>${n}</span><div class="bar"><i style="width:${x*20}%"></i></div>`).join('')+'</div>'}
function buildGarage(){
  $('gCoins').textContent='🪙 '+prof.coins;
  $('gTabs').innerHTML=[['v','🏎️ Vehículos'],['c','🎨 Pinturas'],['h','🎩 Gorros']].map(([k,t])=>`<div class="chip${gTab===k?' on':''}" data-k="${k}">${t}</div>`).join('');
  $('gTabs').querySelectorAll('.chip').forEach(el=>el.onclick=()=>{gTab=el.dataset.k;gAsk=null;tryOn=null;buildGarage();setupGrid()});
  let items;
  if(gTab==='v')items=VKEYS.map(k=>({key:k,on:prof.veh===k,own:owns.v(k),price:VEH[k].price,html:`<div class="e">${VEH[k].ic}</div><div class="n">${VEH[k].name}</div>`}));
  else if(gTab==='h')items=HATS.map(h=>({key:h.id,on:prof.hat===h.id,own:owns.h(h.id),price:h.price,html:`<div class="e">${h.ic}</div><div class="n">${h.name}</div>`}));
  else items=COLORS.map((c,i)=>({key:i,on:prof.color===i,own:owns.c(i),price:CPRICE[i],html:`<span class="sw" style="background:${hex(c)}"></span><div class="n">${CNAMES[i]}</div>`}));
  $('gList').innerHTML=items.map(it=>`<div class="gi${it.on?' on':''}${gAsk===String(it.key)?' ask':''}${it.own?'':' lock'}" data-k="${it.key}">${it.html}<div class="p">${it.on?'✔ Puesto':it.own?'Tuyo':'🪙 '+it.price}</div></div>`).join('');
  $('gList').querySelectorAll('.gi').forEach(el=>el.onclick=()=>garageTap(el.dataset.k));
  let info='';
  if(gTab==='v'){const k=(tryOn&&tryOn.veh)||prof.veh;info=`<b>${VEH[k].ic} ${VEH[k].name}:</b> ${VEH[k].desc}`+statBars(k)}
  if(gAsk!==null){const it=items.find(x=>String(x.key)===gAsk);if(it)info+=`<p style="color:#7dffa6"><b>Toca otra vez para comprarlo por ${it.price} 🪙</b>${prof.coins<it.price?'<br>Te faltan '+(it.price-prof.coins)+' 🪙':''}</p>`}
  $('gInfo').innerHTML=info;
}
function garageTap(key){
  const k=gTab==='c'?+key:key,own=gTab==='v'?owns.v(k):gTab==='h'?owns.h(k):owns.c(k);
  const field=gTab==='v'?'veh':gTab==='h'?'hat':'color';
  const price=gTab==='v'?VEH[k].price:gTab==='h'?HATS.find(h=>h.id===k).price:CPRICE[k];
  if(own){prof[field]=k;saveProf();gAsk=null;tryOn=null;sfx('item')}
  else if(gAsk===String(key)){
    if(prof.coins>=price){prof.coins-=price;prof.own[gTab].push(k);prof[field]=k;saveProf();gAsk=null;tryOn=null;sfx('win');toast('🎉 ¡Comprado!');if(gTab==='v')unlock('garaje')}
    else{sfx('lose');toast('Te faltan '+(price-prof.coins)+' 🪙. ¡Corre para ganar más!')}
  }else{gAsk=String(key);tryOn={[field]:k};sfx('roll')}
  buildGarage();setupGrid();
}
$('garB').onclick=openGarage;$('gDone').onclick=closeGarage;

G.mode=prof.mode==='tt'?'tt':'race';buildTrack(prof.track||'jardin');applyQ();setupGrid();buildMenu();updCam(0,true);requestAnimationFrame(loop);
window.__game={G,podium:(pts)=>{G.mode="cup";G.cup={i:3,pts};showPodium()},build:t=>{buildTrack(t);setupGrid()},info:()=>({TRK,SHORT,RAMPS,SEG,len:SEG*N,ghostMesh,ghost:!!ghost}),start:startRace,useItem,giveItem,hazards,step(n=1){for(let i=0;i<n;i++)update(1/60);R.render(scene,cam)},cars:()=>cars,P:()=>P,prof,ranking,N,SEG};
})();
</script>
