<style>
:root{--ink:#1c1640;--y:#ffd23f;--p:#ff4f9a;--b:#3bb6ff;--g:#4fd67a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;font-family:'Baloo 2',system-ui,sans-serif;color:#fff;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px;z-index:20;text-align:center}
.ov.on{display:flex}
#menu{background:radial-gradient(circle at 50% 30%,#7b5cff,#3a1f9e 70%);overflow:auto;justify-content:flex-start;padding-top:max(16px,3vh)}
h1{font-size:clamp(44px,10vw,92px);margin:0;line-height:.9;font-weight:800;color:var(--y);text-shadow:0 6px 0 #c4377a,0 10px 0 rgba(0,0,0,.25);transform:rotate(-3deg)}
.sub{opacity:.9;margin:6px 0 4px;font-size:18px}
.coins{font-size:22px;font-weight:800;color:var(--y);background:rgba(0,0,0,.2);border-radius:14px;padding:2px 14px;margin:4px 0}
.card{background:rgba(255,255,255,.12);border-radius:22px;padding:12px 14px;margin:5px 0;width:min(560px,100%);flex-shrink:0}
.card h3{margin:0 0 8px;font-size:18px;color:var(--y)}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.sw{width:38px;height:38px;border-radius:50%;border:4px solid transparent;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000}
.sw.on{border-color:#fff;transform:scale(1.12)}
.chip{padding:5px 11px;border-radius:14px;background:rgba(255,255,255,.15);cursor:pointer;font-weight:600;font-size:16px;border:3px solid transparent}
.chip.on{border-color:var(--y);background:rgba(255,210,63,.25)}
.chip.lock{opacity:.75;background:rgba(0,0,0,.25)}
.chip.ask{border-color:var(--g);background:rgba(79,214,122,.35);opacity:1}
input{font:inherit;font-size:20px;padding:6px 12px;border-radius:14px;border:0;width:220px;text-align:center;color:var(--ink);user-select:text;-webkit-user-select:text}
.btn{font:inherit;font-weight:800;font-size:28px;padding:10px 34px;border:0;border-radius:20px;background:var(--y);color:var(--ink);box-shadow:0 6px 0 #c48d00;cursor:pointer;margin:8px 6px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c48d00}
.btn.s{font-size:18px;padding:7px 18px;background:#fff;box-shadow:0 5px 0 #9b9bd0;margin:5px 4px}
#preview{width:150px;height:150px;flex-shrink:0}
.stats{opacity:.85;font-size:15px;margin-top:6px}
#hud{position:fixed;left:0;right:0;top:0;display:none;justify-content:center;pointer-events:none;z-index:5;padding:8px 64px}
#hud.on{display:flex;flex-direction:column;align-items:center}
#hudBox{background:rgba(28,22,64,.65);border-radius:16px;padding:4px 16px;text-align:center;line-height:1.1}
#hudTitle{font-weight:800;font-size:18px;color:var(--y)}
#hudInfo{font-size:16px}
#prog{display:none;position:relative;width:min(420px,70vw);height:14px;margin-top:6px;background:rgba(28,22,64,.55);border-radius:8px}
#prog .pd{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;margin-left:-5px;border:1px solid rgba(0,0,0,.4)}
#prog .pd.me{top:-4px;width:20px;height:20px;margin-left:-10px;border:3px solid var(--y);z-index:2}
#prog .flag{position:absolute;right:-8px;top:-8px;font-size:18px}
#pauseB{position:fixed;left:10px;top:10px;z-index:6;width:46px;height:46px;border-radius:14px;border:0;background:rgba(28,22,64,.6);color:#fff;font-size:22px;display:none}
#emotes{position:fixed;right:10px;top:10px;z-index:6;display:none;gap:6px}
#emotes button{width:46px;height:46px;border-radius:14px;border:0;background:rgba(28,22,64,.6);font-size:24px;padding:0}
#banner{position:fixed;left:0;right:0;top:28%;text-align:center;font-weight:800;font-size:clamp(44px,11vw,104px);color:#fff;text-shadow:0 6px 0 var(--p),0 10px 12px rgba(0,0,0,.3);pointer-events:none;z-index:8;opacity:0;transition:opacity .2s}
#banner.on{opacity:1}
#banner small{display:block;font-size:.3em;text-shadow:0 3px 0 var(--ink)}
#spect{position:fixed;bottom:16px;left:0;right:0;text-align:center;font-size:18px;display:none;z-index:6;pointer-events:none}
#joy{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.4);display:none;z-index:7;pointer-events:none;margin:-60px 0 0 -60px}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.75)}
.tb{position:fixed;z-index:7;border-radius:50%;border:4px solid rgba(255,255,255,.7);background:rgba(255,79,154,.55);color:#fff;font-weight:800;display:none;align-items:center;justify-content:center;font-family:inherit}
#jumpB{right:22px;bottom:26px;width:96px;height:96px;font-size:20px}
#diveB{right:128px;bottom:20px;width:76px;height:76px;font-size:14px;background:rgba(59,182,255,.55)}
.touch.playing .tb{display:flex}
#result,#pause,#howto,#achOv{background:rgba(28,22,64,.84)}
#result.pod{justify-content:flex-end;background:linear-gradient(rgba(28,22,64,0) 35%,rgba(28,22,64,.9) 75%)}
#result.pod #list{display:none}
#result h2,#pause h2,#howto h2,#achOv h2{font-size:clamp(32px,7vw,58px);margin:0;color:var(--y);line-height:1}
#list{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:620px;margin:12px 0}
.pl{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:12px;font-size:16px}
.pl.out{opacity:.35;text-decoration:line-through}
.pl.me{outline:3px solid var(--y)}
.dot{width:16px;height:16px;border-radius:50%}
#howto .tip{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.12);border-radius:18px;padding:10px 16px;margin:6px 0;width:min(520px,100%);text-align:left;font-size:20px}
#howto .tip b{font-size:34px}
#howSub{font-size:20px;margin:4px 0 8px;opacity:.9}
#achList{display:flex;flex-direction:column;gap:6px;width:min(520px,100%);max-height:60vh;overflow:auto;margin:10px 0}
.ach{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.1);border-radius:14px;padding:6px 12px;text-align:left}
.ach.no{opacity:.45}
.ach b{font-size:26px}
#toasts{position:fixed;right:10px;top:64px;z-index:30;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}
.toast{background:rgba(28,22,64,.9);border:3px solid var(--y);border-radius:14px;padding:6px 12px;font-size:16px;animation:tin .3s}
@media (max-width:640px){#emotes{top:auto;bottom:136px;right:14px;flex-direction:column}#toasts{top:110px}}
@keyframes tin{from{transform:translateX(120%)}to{transform:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud"><div id="hudBox"><div id="hudTitle"></div><div id="hudInfo"></div></div><div id="prog"></div></div>
<button id="pauseB" aria-label="Pausa">⏸</button>
<div id="emotes"><button data-e="hola" aria-label="Saludar">👋</button><button data-e="baile" aria-label="Bailar">💃</button><button data-e="fiesta" aria-label="Celebrar">🎉</button></div>
<div id="banner"></div>
<div id="spect"></div>
<div id="toasts"></div>
<div id="joy"><div id="knob"></div></div>
<button class="tb" id="diveB">EMBESTIR</button>
<button class="tb" id="jumpB">SALTAR</button>

<div class="ov on" id="menu">
  <h1>¡Tropezones!</h1>
  <div class="sub">3 rondas · 12 bolitos · ¡solo uno se lleva la corona!</div>
  <div class="coins" id="coinTxt"></div>
  <canvas id="preview" width="300" height="300"></canvas>
  <div class="card"><h3>Tu nombre</h3><input id="nameIn" maxlength="12"></div>
  <div class="card"><h3>Dificultad</h3><div class="row" id="diffs"></div></div>
  <button class="btn" id="playB">¡A JUGAR!</button>
  <div class="card"><h3>🛍️ Tienda · Sombrero</h3><div class="row" id="hats"></div></div>
  <div class="card"><h3>🛍️ Tienda · Cara</h3><div class="row" id="faces"></div></div>
  <div class="card"><h3>🛍️ Tienda · Color</h3><div class="row" id="colors"></div></div>
  <div class="row"><button class="btn s" id="achB">🏆 Logros</button><button class="btn s" id="musB">🎵 Música</button><button class="btn s" id="sndB">🔊 Sonido</button><button class="btn s" id="qB">⚙️ Calidad</button></div>
  <div class="stats" id="stats"></div>
  <div class="stats">Teclado: WASD/flechas mover · Espacio saltar · Shift embestir · 1 2 3 bailes</div>
</div>

<div class="ov" id="howto">
  <h2 id="howT"></h2>
  <div id="howSub"></div>
  <div id="howTips"></div>
  <button class="btn" id="howB">¡Listo!</button>
</div>

<div class="ov" id="result">
  <h2 id="resT"></h2>
  <div id="resS" style="font-size:20px"></div>
  <div id="list"></div>
  <div class="row" id="resBtns"></div>
</div>

<div class="ov" id="pause">
  <h2>Pausa</h2>
  <button class="btn" id="resumeB">Seguir</button>
  <div class="row"><button class="btn s" id="musB2">🎵 Música</button><button class="btn s" id="sndB2">🔊 Sonido</button><button class="btn s" id="qB2">⚙️ Calidad</button></div>
  <button class="btn s" id="quitB">Salir al menú</button>
</div>

<div class="ov" id="achOv">
  <h2>🏆 Logros</h2>
  <div id="achList"></div>
  <button class="btn" id="achClose">Volver</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const mod=(a,m)=>((a%m)+m)%m;
function lerpAng(a,b,t){let d=mod(b-a+Math.PI,Math.PI*2)-Math.PI;return a+d*t}
const isTouch='ontouchstart'in window||navigator.maxTouchPoints>0;
if(isTouch)document.body.classList.add('touch');

// ---------- tienda y perfil ----------
const COLORS=[0xff5a5f,0xff9f1c,0xffd23f,0x4fd67a,0x3bb6ff,0xb15cff,0x2ec4b6,0x5e60ce,0xff70c8,0xf5f5f5,0x8d6e63,0x333344];
const COLOR_FREE=6,COLOR_PRICE=30;
const HATS=[['nada',0],['gorro',0],['brote',0],['gafas',40],['cuernos',60],['orejas',80],['hélice',100],['chistera',120],['corona',150],['aureola',200]];
const FACES=[['normal',0],['feliz',50],['ojazos',60],['enfadado',60]];
const DIFFS=[{name:'Fácil',sk:[.05,.55],spd:[.56,.14],err:1.5},{name:'Normal',sk:[.25,.95],spd:[.64,.16],err:1},{name:'Difícil',sk:[.55,1],spd:[.72,.18],err:.6}];
let prof={name:'Jugador',color:4,hat:1,face:0,diff:1,wins:0,played:0,coins:0,own:{h:[],c:[],f:[]},ach:{},knocks:0};
try{const sv=JSON.parse(localStorage.getItem('trz_prof')||'{}');Object.assign(prof,sv);prof.own=Object.assign({h:[],c:[],f:[]},sv.own||{});prof.ach=sv.ach||{}}catch(e){}
function saveProf(){try{localStorage.setItem('trz_prof',JSON.stringify(prof))}catch(e){}}
let cfg={music:true,snd:true,q:isTouch?'media':'alta'};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('trz_cfg')||'{}'))}catch(e){}
function saveCfg(){try{localStorage.setItem('trz_cfg',JSON.stringify(cfg))}catch(e){}}
const ownsHat=i=>HATS[i][1]===0||prof.own.h.includes(i);
const ownsFace=i=>FACES[i][1]===0||prof.own.f.includes(i);
const ownsColor=i=>i<COLOR_FREE||prof.own.c.includes(i);

// ---------- logros ----------
const ACH=[
  ['primera','🎈','Primera partida','Juega tu primera partida'],
  ['clasif','✅','¡Clasificado!','Supera la primera ronda'],
  ['oro','🥇','Más rápido que nadie','Llega el 1º a la meta'],
  ['sincaer','🦶','Pies de hierro','Termina una carrera sin caerte'],
  ['hielo','🧊','Patinador','Supera la Pista Resbalosa'],
  ['suelo','⬜','Equilibrista','Sobrevive al Suelo Fugaz'],
  ['meteoro','☄️','Esquiva-rocas','Sobrevive a la Lluvia de Meteoritos'],
  ['colina','⭐','Rey de la colina','Acaba 1º en Rey de la Colina'],
  ['final','🔥','Finalista','Llega a la final'],
  ['corona','👑','¡Corona!','Gana una partida'],
  ['corona5','🏰','Realeza','Gana 5 coronas'],
  ['embestida','💨','Torbellino','Tira a 10 bolitos embistiendo'],
  ['emote','💃','¡A bailar!','Haz un baile'],
  ['rico','💰','Hucha llena','Junta 500 monedas'],
];
function unlock(id){
  if(prof.ach[id])return;const a=ACH.find(x=>x[0]===id);if(!a)return;
  prof.ach[id]=1;prof.coins+=25;saveProf();toast(`🏆 ${a[2]} <b>+25 🪙</b>`);sfx('coin');
}
function toast(html){const d=document.createElement('div');d.className='toast';d.innerHTML=html;$('toasts').appendChild(d);setTimeout(()=>d.remove(),3200)}

// ---------- audio ----------
let AC=null,musT=null,musStep=0,track='main';
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}if(cfg.music)startMusic()}
function _tone(f,d,type,v,slide,when,mute){if(!AC||mute)return;if(type==='mus')type='square';const t=AC.currentTime+when,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}
const midi=n=>440*Math.pow(2,(n-69)/12);
function sfx(k){
  if(!AC||!cfg.snd)return;
  const T=(f,d,ty,v,s,w)=>_tone(f,d,ty||'square',v||.08,s||0,w||0,false);
  if(k==='jump')T(320,.16,'square',.05,380);
  else if(k==='dive')T(500,.2,'sawtooth',.05,-300);
  else if(k==='bump')T(140,.18,'triangle',.12,-60);
  else if(k==='boing')T(200,.35,'sine',.12,600);
  else if(k==='beep')T(660,.18,'square',.07);
  else if(k==='go')T(990,.4,'square',.07);
  else if(k==='win')[72,76,79,84].forEach((n,i)=>T(midi(n),.25,'square',.07,0,i*.12));
  else if(k==='lose')[67,63,60,55].forEach((n,i)=>T(midi(n),.3,'triangle',.1,0,i*.16));
  else if(k==='fall')T(500,.6,'sine',.08,-420);
  else if(k==='crack')T(90,.12,'sawtooth',.05);
  else if(k==='coin'){T(988,.08,'square',.05);T(1319,.2,'square',.05,0,.08)}
  else if(k==='laugh')[0,1,2,3].forEach(i=>T(520-i*40,.07,'triangle',.06,60,i*.09));
  else if(k==='whoosh')T(900,.5,'sawtooth',.025,-700);
  else if(k==='boom'){T(110,.45,'sawtooth',.13,-80);T(60,.5,'triangle',.15,-30)}
  else if(k==='tick')T(1400,.05,'square',.03);
  else if(k==='emote')[0,1,2].forEach(i=>T(midi(76+i*4),.1,'square',.04,0,i*.07));
  else if(k==='buy')[0,1,2,3].forEach(i=>T(midi(72+i*5),.12,'square',.05,0,i*.06));
}
let lastSpeak=0;
function speak(t){if(!cfg.snd||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=1.05;u.pitch=1.6;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const TRACKS={
  main:{ms:140,mel:[72,0,76,79,77,0,74,0,72,76,79,84,83,0,79,0,81,0,77,81,79,0,76,0,74,77,76,74,72,0,0,0],bas:[48,48,55,55,53,53,50,50,48,48,55,55,52,52,55,55,53,53,53,53,48,48,48,48,50,50,55,55,48,48,43,43]},
  final:{ms:118,mel:[69,0,72,76,74,72,71,0,69,72,76,81,79,0,76,0,77,0,76,74,72,0,71,0,69,71,72,74,76,0,0,0],bas:[45,45,52,52,45,45,52,52,41,41,48,48,40,40,47,47,45,45,52,52,41,41,48,48,40,40,44,44,45,45,40,40]},
};
function startMusic(){if(!AC||musT)return;const tr=TRACKS[track];musT=setInterval(()=>{if(!AC||document.hidden||!cfg.music)return;const i=musStep++%32;if(tr.mel[i])_tone(midi(tr.mel[i]),.18,'square',.025,0,0,false);if(i%2===0)_tone(midi(tr.bas[i]),.22,'triangle',.07,0,0,false)},tr.ms)}
function stopMusic(){clearInterval(musT);musT=null}
function setTrack(k){if(track===k)return;track=k;if(musT){stopMusic();startMusic()}}
function toggleMusic(){cfg.music=!cfg.music;saveCfg();if(cfg.music){initAudio();startMusic()}else stopMusic();updBtns()}
function toggleSnd(){cfg.snd=!cfg.snd;saveCfg();updBtns()}
const QN={alta:'Alta',media:'Media',baja:'Baja'};
function cycleQ(){cfg.q=cfg.q==='alta'?'media':cfg.q==='media'?'baja':'alta';saveCfg();applyQ();updBtns()}
function updBtns(){['musB','musB2'].forEach(i=>$(i).textContent='🎵 Música: '+(cfg.music?'sí':'no'));['sndB','sndB2'].forEach(i=>$(i).textContent='🔊 Sonido: '+(cfg.snd?'sí':'no'));['qB','qB2'].forEach(i=>$(i).textContent='⚙️ Calidad: '+QN[cfg.q])}

// ---------- three ----------
const canvas=$('c');
const R=new THREE.WebGLRenderer({canvas,antialias:!isTouch,powerPreference:'high-performance'});
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFShadowMap;
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8fd3ff);
scene.fog=new THREE.Fog(0x8fd3ff,45,130);
const cam=new THREE.PerspectiveCamera(60,1,.1,300);
scene.add(new THREE.HemisphereLight(0xffffff,0x7d8fd0,.75));
const sun=new THREE.DirectionalLight(0xffffff,.75);
sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-22,right:22,top:22,bottom:-22,near:1,far:70});
scene.add(sun);scene.add(sun.target);
function applyQ(){
  const q=cfg.q;R.setPixelRatio(q==='alta'?Math.min(devicePixelRatio||1,1.5):q==='media'?Math.min(devicePixelRatio||1,1):.75);
  sun.castShadow=q!=='baja';const ms=q==='alta'?1024:512;
  if(sun.shadow.mapSize.x!==ms){sun.shadow.mapSize.set(ms,ms);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null}}
  resize();
}
const world=new THREE.Group();scene.add(world);

const sea=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.MeshLambertMaterial({color:0x7a7cff}));
sea.rotation.x=-Math.PI/2;sea.position.y=-30;scene.add(sea);

}

  if(!e.hold||e.think<=0){const a=rnd(0,Math.PI*2),r=rnd(0,6);e.hold={x:Math.cos(a)*r,z:Math.sin(a)*r};e.think=rnd(1.5,4)}
  let ix=(e.hold.x-e.x)*.3,iz=(e.hold.z-e.z)*.3;
  const react=.4+e.skill*.7;
  for(const o of obs){if(o.kind!=='meteor'||o.dead||o.T-o.t>o.T)continue;if(o.t>react)continue;
    const dx=e.x-o.x,dz=e.z-o.z,d=Math.hypot(dx,dz)||.01;const R=o.r+1.4;if(d<R){const f=(R-d)*2.2;ix+=dx/d*f;iz+=dz/d*f}}
  const rr=Math.hypot(e.x,e.z);if(rr>8){ix-=e.x/rr*1.5;iz-=e.z/rr*1.5}
  const m=Math.hypot(ix,iz);if(m>1){ix/=m;iz/=m}if(m<.15){ix=iz=0}
  e.ix=ix;e.iz=iz;e.jumpReq=false;
}

function updZone(dt){

  Z.x+=(Z.tx-Z.x)*Math.min(1,dt*1.5);Z.z+=(Z.tz-Z.z)*Math.min(1,dt*1.5);
  Z.mesh.position.set(Z.x,0,Z.z);const s=Z.mesh.getObjectByName('star');s.rotation.y+=dt*2;s.position.y=3.6+Math.sin(G.t*3)*.2;

function inZone(e){const Z=G.zone;return Z&&!e.out&&e.y>-.5&&e.y<3&&Math.hypot(e.x-Z.x,e.z-Z.z)<Z.r}
function botHill(e,dt){
  const Z=G.zone;e.think-=dt;
  if(!e.hold||e.think<=0){const a=rnd(0,Math.PI*2),r=rnd(0,1.8);e.hold={a,r};e.think=rnd(1,3)}
  const tx=Z.tx+Math.cos(e.hold.a)*e.hold.r,tz=Z.tz+Math.sin(e.hold.a)*e.hold.r;
  const dx=tx-e.x,dz=tz-e.z,d=Math.hypot(dx,dz);

    for(const o of G.parts){if(o===e||o.out||!inZone(o))continue;const ox=o.x-e.x,oz=o.z-e.z,od=Math.hypot(ox,oz);
      if(od<2.6&&Math.random()<dt*(.6+e.skill*2.2)){e.ix=ox/od;e.iz=oz/od;e.face=e.faceT=Math.atan2(ox,oz);e.diveReq=true;break}}
  }
}

function buildFinal(){
  const top=new THREE.MeshLambertMaterial({map:ringTex(['#ffd23f','#ff9f1c','#ffd23f','#ff9f1c','#ffd23f'])}),side=mat(0xff4f9a);
  addPlat(0,0,0,0,0,0,{circle:10,h:1.5,material:[side,top,side]});
  const post=new THREE.Mesh(new THREE.CylinderGeometry(.7,.9,2.6,16),mat(0x5e60ce));post.position.set(0,1.3,0);world.add(post);
  mkObs({type:'capsule',a:{x:0,y:0,z:0},b:{x:0,y:2.6,z:0},r:.75,power:0});
  const mkBar=(y,r,c1,c2,w,startT)=>{
    const grp=new THREE.Group();grp.position.set(0,y,0);world.add(grp);
    const bar=new THREE.Mesh(new THREE.CylinderGeometry(r,r,22,12),new THREE.MeshLambertMaterial({map:stripeTex(c1,c2,14)}));bar.rotation.z=Math.PI/2;bar.castShadow=true;grp.add(bar);
    grp.visible=startT<=0;grp.scale.setScalar(startT<=0?1:.01);
    return mkObs({type:'capsule',kind:'fbar',a:{x:0,y,z:0},b:{x:0,y,z:0},r,power:9,th:rnd(0,6),w,start:startT,grp,on:startT<=0,
      upd(t,dt){
        if(!this.on){if(G.state==='play'&&G.rt>=this.start){this.on=true;grp.visible=true;banner('¡Barra alta!','¡NO saltes cuando pase!',1.6);sfx('beep');speak('¡Barra alta! No saltes')}else{this.a={x:0,y:-50,z:0};this.b={x:0,y:-50,z:.1};return}}
        if(grp.scale.x<1)grp.scale.setScalar(Math.min(1,grp.scale.x+dt*1.5));
        if(G.state==='play'){this.w=Math.sign(this.w)*Math.min(Math.abs(this.w0)+G.rt*.028,this.max)}
        if(G.state==='play'||G.state==='end')this.th+=this.w*dt;
        const L=11*grp.scale.x,c=Math.cos(this.th)*L,s=Math.sin(this.th)*L;this.a={x:-c,y,z:s};this.b={x:c,y,z:-s};grp.rotation.y=this.th}});
  };
  const lo=mkBar(.7,.32,'#ff3b3b','#ffffff',1.0,0);lo.w0=1.0;lo.max=2.5;lo.low=true;
  const hi=mkBar(1.85,.3,'#ffd23f','#5e60ce',-.8,12);hi.w0=.8;hi.max=2.0;hi.low=false;
}
function barETA(o,e){const phi=Math.atan2(-e.z,e.x);const d=o.w>0?mod(phi-o.th,Math.PI):mod(o.th-phi,Math.PI);return d/Math.abs(o.w)}
function botFinal(e,dt){
  e.think-=dt;
  if(!e.hold||e.think<=0){const a=Math.atan2(e.z,e.x)+rnd(-.7,.7),r=rnd(4,6.8);e.hold={x:Math.cos(a)*r,z:Math.sin(a)*r};e.think=rnd(3,7)}
  const dx=e.hold.x-e.x,dz=e.hold.z-e.z,d=Math.hypot(dx,dz);
  e.ix=d>.5?dx/d*.8:0;e.iz=d>.5?dz/d*.8:0;
  const rr=Math.hypot(e.x,e.z);if(rr>7.5){e.ix=-e.x/rr;e.iz=-e.z/rr}
  let jump=false;
  const bars=obs.filter(o=>o.kind==='fbar'&&o.on);
  const lo=bars.find(o=>o.low),hi=bars.find(o=>!o.low);
  if(lo&&e.ground){
    const t=barETA(lo,e);
    if(t>.6)e.err=(1-e.skill)*rnd(-.18,.18)*(1+G.rt/50)*DIFFS[G.diff].err;
    const r=Math.max(1.5,Math.hypot(e.x,e.z)),want=.14+(.9/r)/Math.abs(lo.w)+e.err;
    if(t<want&&t>want-.12){const th=hi?barETA(hi,e):9;if(th>.75||th<.05||Math.random()<.3)jump=true}
  }
  e.jumpReq=jump;
}

function loadRound(n,id){

  else{const rad=D.id==='meteor'?6:5;order.forEach((e,i)=>{const a=i/order.length*Math.PI*2;e.x=Math.cos(a)*rad;e.z=Math.sin(a)*rad;e.y=0;e.face=e.faceT=Math.atan2(-e.x,-e.z)});
    if(D.id==='final'){const lo=obs.find(o=>o.low);let bt=0,bd=-1;for(let k=0;k<90;k++){const th=k/90*Math.PI;let m=9;for(const e of order){const d=mod(Math.atan2(-e.z,e.x)-th,Math.PI);m=Math.min(m,d,Math.PI-d)}if(m>bd){bd=m;bt=th}}lo.th=bt}}

function eliminate(e){
  if(e.out)return;e.out=true;e.mesh.visible=false;G.elim.push(e);
  if(nearCam(e)||e===G.player)puff(e.x,Math.max(e.y,-8),e.z,8,0xffffff,4,.25);
  if(e===G.player){sfx('fall');banner('¡Eliminado!','Mira cómo acaba la ronda…',2);speak('¡Eliminado!')}
  else if(Math.random()<.5)sfx('laugh');
}
function respawnRace(e){
  const c=G.course.cps[e.cp];e.x=c.z<-80?rnd(-2,2):rnd(-4,4);e.z=c.z+rnd(0,1.5);e.y=c.y+2;e.vx=e.vy=e.vz=0;e.stun=0;e.diving=false;e.lock=0;e.falls++;
  puff(e.x,e.y,e.z,6,0xffffff,3,.2);
  if(e===G.player)sfx('fall');
}
function roundLogic(dt){
  const D=G.def,P=G.parts;
  if(D.kind==='race'){
    const C=G.course;
    for(const e of P){
      if(e.fin)continue;
      while(e.cp<C.cps.length-1&&e.z<C.cps[e.cp+1].z)e.cp++;
      if(e.y<-14)respawnRace(e);
      if(e.z<C.finish&&e.y>C.finY-1){e.fin=true;G.qual.push(e);
        if(e===G.player){const pos=G.qual.length;sfx('win');banner('¡Clasificado!',pos+'º puesto',2);confetti(e.x,e.y+1,e.z);speak('¡Clasificado!');unlock('clasif');if(pos===1)unlock('oro');if(e.falls===0)unlock('sincaer');if(D.id==='ice')unlock('hielo')}
        if(G.qual.length>=G.target)endRound()}
    }
    if(G.state==='play'&&G.rt>150){const rest=P.filter(e=>!e.fin).sort((a,b)=>a.z-b.z);while(G.qual.length<G.target&&rest.length)G.qual.push(rest.shift());endRound()}
  }else if(D.kind==='score'){
    for(const e of P){
      if(inZone(e)){const before=Math.floor(e.pts);e.pts+=dt;if(e===G.player&&Math.floor(e.pts)>before)sfx('tick')}
      if(e.y<-8){e.pts=Math.max(0,e.pts-2);const a=rnd(0,Math.PI*2);e.x=Math.cos(a)*8;e.z=Math.sin(a)*8;e.y=3;e.vx=e.vy=e.vz=0;e.stun=0;e.diving=false;if(e===G.player){sfx('fall');banner('¡Al agua!','-2 puntos',1)}}
    }
    if(G.state==='play'&&G.rt>=D.time){G.qual=P.slice().sort((a,b)=>b.pts-a.pts).slice(0,G.target);if(G.qual[0]===G.player)unlock('colina');endRound()}
  }else{
    for(const e of P)if(!e.out&&e.y<D.lim)eliminate(e);
    const alive=P.filter(e=>!e.out);
    if(G.state==='play'&&(alive.length<=G.target||(D.time&&G.rt>=D.time))){G.qual=alive.slice();endRound()}
  }
}
function endRound(){
  if(G.state!=='play')return;
  G.state='end';G.endT=2.4;
  for(const e of G.parts)if(!G.qual.includes(e))e.gone=true;
  const ok=!G.player.gone,D=G.def;
  if(D.kind==='final'){
    if(ok){banner('¡CORONA!','¡Eres el último en pie!',3);sfx('win');speak('¡Ganaste la corona!');confetti(G.player.x,G.player.y+1,G.player.z)}
    else banner('¡Fin!',(G.qual[0]?G.qual[0].name+' gana la corona':'¡Nadie quedó en pie!'),2.5);
  }else if(ok){
    if(D.kind!=='race'){banner('¡Pasas de ronda!','',2);sfx('win');speak('¡Clasificado!')}
    if(D.id==='tiles')unlock('suelo');if(D.id==='meteor')unlock('meteoro');if(G.round===0)unlock('clasif');
  }else{banner('¡Se acabó!',D.kind==='race'?'No llegaste a tiempo':'Te quedaste fuera',2);sfx('lose');speak('¡Eliminado!')}
  G.parts.filter(e=>G.qual.includes(e)&&e.bot).forEach(e=>{if(Math.random()<.6)doEmote(e,pick(['hola','baile','fiesta']))});
}
function roundEarn(){
  const D=G.def,ok=!G.player.gone;let c=0;
  if(D.kind==='final')c=ok?60:15;
  else if(ok){c=D.kind==='race'?10:20;if(D.kind==='race'&&G.qual[0]===G.player)c+=10;if(D.kind==='score'&&G.qual[0]===G.player)c+=10}
  else c=5;
  return c;
}

  if(last&&ok){T='👑 ¡GANASTE!';S='¡'+G.player.name+' se lleva la corona de los Tropezones!';prof.wins++;unlock('corona');if(prof.wins>=5)unlock('corona5')}
  else if(last){const w=G.qual[0];T='Fin de la partida';S=w?('Ganó '+w.name+' 👑. ¡Llegaste a la final!'):'¡Nadie quedó en pie!'}
  else if(ok){T='¡Clasificado!';S='Siguiente: '+RDEF[G.seq[G.round+1]].name;if(G.round===1)unlock('final')}
  else{T='¡Eliminado!';S='Caíste en la ronda '+(G.round+1)+' · '+D.name;sfx('lose')}
  if(prof.coins>=500)unlock('rico');
  saveProf();
  if(last){G.state='podium';buildPodium();$('result').classList.add('pod')}else G.state='result';
  document.body.classList.remove('playing');
  $('hud').classList.remove('on');$('pauseB').style.display='none';$('emotes').style.display=last?'flex':'none';$('spect').style.display='none';arrow.visible=false;
  $('resT').textContent=T;$('resS').innerHTML=S+`<br><b style="color:#ffd23f">+${earn} 🪙</b> · tienes ${prof.coins} 🪙`;
  setTimeout(()=>sfx('coin'),300);
  const sorted=D.kind==='score'?G.parts.slice().sort((a,b)=>b.pts-a.pts):G.parts;
  $('list').innerHTML=sorted.map(e=>`<div class="pl ${e.gone?'out':''} ${e===G.player?'me':''}"><span class="dot" style="background:#${new THREE.Color(e.color).getHexString()}"></span>${e.name}${D.kind==='score'?' · '+Math.floor(e.pts):''}</div>`).join('');
  const b=$('resBtns');b.innerHTML='';
  const mk=(t,cls,f)=>{const x=document.createElement('button');x.className='btn '+cls;x.textContent=t;x.onclick=f;b.appendChild(x)};
  if(ok&&!last)mk('Siguiente ronda ▶','',()=>loadRound(G.round+1));
  else{mk('Jugar otra vez','',startGame);mk('Menú','s',toMenu)}
  $('result').classList.add('on');
}
function toMenu(){
  G.state='menu';G.paused=false;['result','pause','howto'].forEach(id=>$(id).classList.remove('on'));$('result').classList.remove('pod');
  document.body.classList.remove('playing');$('hud').classList.remove('on');$('pauseB').style.display='none';$('emotes').style.display='none';$('spect').style.display='none';
  setTrack('main');$('menu').classList.add('on');buildMenu();
}

// ---------- HUD ----------
let banT=0;
function banner(t,s,d){$('banner').innerHTML=t+(s?'<small>'+s+'</small>':'');$('banner').classList.add('on');banT=d}
function buildProg(){
  const pr=$('prog');pr.innerHTML='';
  if(G.def.kind!=='race'){pr.style.display='none';return}
  pr.style.display='block';pr.insertAdjacentHTML('beforeend','<span class="flag">🏁</span>');
  for(const e of G.parts){const d=document.createElement('div');d.className='pd'+(e===G.player?' me':'');d.style.background='#'+new THREE.Color(e.color).getHexString();pr.appendChild(d);e.pd=d}
}
function updProg(){
  if(G.def.kind!=='race')return;const C=G.course,L=C.start-C.finish;
  for(const e of G.parts){if(!e.pd)continue;const f=e.fin?1:clamp((C.start-e.z)/L,0,1);e.pd.style.left=(f*100)+'%'}
}
function updHud(){
  const D=G.def;$('hudTitle').textContent='Ronda '+(G.round+1)+' · '+D.name;
  let info='';const P=G.parts,me=G.player;
  if(D.kind==='race'){const pos=me.fin?G.qual.indexOf(me)+1:G.qual.length+1+P.filter(e=>!e.fin&&e!==me&&e.z<me.z).length;info=`Clasificados ${G.qual.length}/${G.target} · Tú: ${pos}º · ${Math.max(0,150-G.rt|0)}s`}
  else if(D.kind==='score'){const rank=1+P.filter(e=>e!==me&&e.pts>me.pts).length;info=`⭐ ${Math.floor(me.pts)} puntos · ${rank}º · ${Math.max(0,D.time-G.rt|0)}s`}
  else{const a=P.filter(e=>!e.out).length;info=D.kind==='final'?`Quedan ${a} en pie`:`Quedan ${a} · pasan ${G.target} · ${Math.max(0,D.time-G.rt|0)}s`}
  $('hudInfo').textContent=info;
}
const conf=[];const confG=new THREE.PlaneGeometry(.18,.28);
function confetti(x,y,z){for(let i=0;i<70;i++){const m=new THREE.Mesh(confG,new THREE.MeshBasicMaterial({color:pick(COLORS),side:THREE.DoubleSide}));m.position.set(x,y,z);scene.add(m);conf.push({m,vx:rnd(-6,6),vy:rnd(6,14),vz:rnd(-6,6),r:rnd(-8,8),life:rnd(1.8,3)})}}
function updConf(dt){for(let i=conf.length-1;i>=0;i--){const c=conf[i];c.vy-=15*dt;c.m.position.x+=c.vx*dt;c.m.position.y+=c.vy*dt;c.m.position.z+=c.vz*dt;c.m.rotation.x+=c.r*dt;c.m.rotation.y+=c.r*dt;c.life-=dt;if(c.life<=0){scene.remove(c.m);c.m.material.dispose();conf.splice(i,1)}}}
function updArrow(){
  const p=G.player;arrow.visible=false;
  if(G.state!=='play'||p.out||p.gone||p.fin)return;
  let tx,tz;
  if(G.def.kind==='race'){const s=raceSec(p.z-3);tx=guideX(p,s);tz=p.z-5}
  else if(G.def.kind==='score'&&!inZone(p)){tx=G.zone.x;tz=G.zone.z}
  else return;
  const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);if(d<.5)return;
  arrow.visible=true;arrow.position.set(p.x+dx/d*1.5,p.y+.12,p.z+dz/d*1.5);arrow.rotation.y=Math.atan2(dx,dz);
  arrow.scale.setScalar(1+Math.sin(G.t*6)*.08);
}

// ---------- entrada ----------
const keys={};let jumpBuf=0,diveBuf=0;
const joy={x:0,y:0,id:null,ox:0,oy:0};
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;keys[e.code]=true;if(e.code==='Space'){jumpBuf=.15;e.preventDefault()}if(e.code==='ShiftLeft'||e.code==='ShiftRight'||e.code==='KeyE')diveBuf=.15;if(e.code==='Escape'||e.code==='KeyP')togglePause();if(e.code==='Digit1')doEmote(G.player,'hola');if(e.code==='Digit2')doEmote(G.player,'baile');if(e.code==='Digit3')doEmote(G.player,'fiesta');if(e.code==='Enter'&&G.state==='howto')beginCount()});
addEventListener('keyup',e=>{keys[e.code]=false});
canvas.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;if(joy.id===null&&e.clientX<innerWidth*.6){joy.id=e.pointerId;joy.ox=e.clientX;joy.oy=e.clientY;const j=$('joy');j.style.left=e.clientX+'px';j.style.top=e.clientY+'px';j.style.display='block';$('knob').style.transform='translate(0,0)'}});
addEventListener('pointermove',e=>{if(e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),mx=50;if(d>mx){dx*=mx/d;dy*=mx/d}joy.x=dx/mx;joy.y=dy/mx;$('knob').style.transform=`translate(${dx}px,${dy}px)`});
const endJoy=e=>{if(e.pointerId!==joy.id)return;joy.id=null;joy.x=joy.y=0;$('joy').style.display='none'};
addEventListener('pointerup',endJoy);addEventListener('pointercancel',endJoy);
$('jumpB').addEventListener('pointerdown',e=>{e.preventDefault();jumpBuf=.15;initAudio()});
$('diveB').addEventListener('pointerdown',e=>{e.preventDefault();diveBuf=.15;initAudio()});
document.querySelectorAll('#emotes button').forEach(b=>b.addEventListener('click',()=>doEmote(G.player,b.dataset.e)));
function playerInput(dt){
  const p=G.player;if(p.out||p.gone){p.ix=p.iz=0;return}
  const k=keys;let ix=joy.x+((k.KeyD||k.ArrowRight)?1:0)-((k.KeyA||k.ArrowLeft)?1:0);let iz=joy.y+((k.KeyS||k.ArrowDown)?1:0)-((k.KeyW||k.ArrowUp)?1:0);
  if(Math.hypot(ix,iz)<.15)ix=iz=0;
  p.ix=ix;p.iz=iz;
  p.jumpReq=jumpBuf>0;if(p.jumpReq&&p.coy>0)jumpBuf=0;
  p.diveReq=diveBuf>0;if(p.diveReq)diveBuf=0;
  jumpBuf-=dt;diveBuf-=dt;
}
function togglePause(){if(!['play','count','end'].includes(G.state))return;G.paused=!G.paused;$('pause').classList.toggle('on',G.paused)}
$('pauseB').onclick=togglePause;$('resumeB').onclick=togglePause;
$('quitB').onclick=()=>toMenu();
$('musB').onclick=$('musB2').onclick=toggleMusic;
$('sndB').onclick=$('sndB2').onclick=toggleSnd;
$('qB').onclick=$('qB2').onclick=cycleQ;
$('howB').onclick=beginCount;
$('playB').onclick=()=>{prof.name=($('nameIn').value||'Jugador').trim().slice(0,12);saveProf();startGame()};
$('achB').onclick=()=>{$('achList').innerHTML=ACH.map(a=>`<div class="ach ${prof.ach[a[0]]?'':'no'}"><b>${prof.ach[a[0]]?a[1]:'🔒'}</b><div><div style="font-weight:800">${a[2]}</div><div style="opacity:.85">${a[3]}</div></div></div>`).join('');$('achOv').classList.add('on')};
$('achClose').onclick=()=>$('achOv').classList.remove('on');

// ---------- menú / tienda ----------
let askKey=null,askT=0;
function shopClick(kind,i,price,owned,select){
  if(owned){select();saveProf();askKey=null;buildMenu();return}
  const key=kind+i;
  if(prof.coins<price){toast(`Te faltan ${price-prof.coins} 🪙. ¡Juega para ganar más!`);pv[kind]=i;refreshPreview();setTimeout(()=>{pv[kind]=null;refreshPreview()},1500);return}
  if(askKey===key&&performance.now()-askT<4000){prof.coins-=price;prof.own[kind==='hat'?'h':kind==='face'?'f':'c'].push(i);select();saveProf();sfx('buy');toast('¡Comprado! 🎉');askKey=null;buildMenu();return}
  askKey=key;askT=performance.now();pv[kind]=i;refreshPreview();pv[kind]=null;buildMenu(true);
}
function buildMenu(keepPreview){
  $('nameIn').value=prof.name;
  $('coinTxt').textContent=prof.coins+' 🪙';
  $('diffs').innerHTML='';DIFFS.forEach((d,i)=>{const c=document.createElement('div');c.className='chip'+(i===prof.diff?' on':'');c.textContent=['🐣 ','🙂 ','🔥 '][i]+d.name;c.onclick=()=>{prof.diff=i;saveProf();buildMenu()};$('diffs').appendChild(c)});
  const chipFor=(kind,i,label,price,owned,sel,select)=>{const d=document.createElement('div');const ask=askKey===kind+i;d.className='chip'+(sel?' on':'')+(owned?'':' lock')+(ask?' ask':'');d.innerHTML=ask?`¿Comprar? ${price} 🪙`:label+(owned?'':` 🔒${price}`);d.onclick=()=>shopClick(kind,i,price,owned,select);return d};
  $('hats').innerHTML='';HATS.forEach((h,i)=>$('hats').appendChild(chipFor('hat',i,h[0],h[1],ownsHat(i),i===prof.hat,()=>prof.hat=i)));
  $('faces').innerHTML='';FACES.forEach((f,i)=>$('faces').appendChild(chipFor('face',i,f[0],f[1],ownsFace(i),i===prof.face,()=>prof.face=i)));
  $('colors').innerHTML='';COLORS.forEach((c,i)=>{const owned=ownsColor(i),ask=askKey==='color'+i;const d=document.createElement('div');d.className='sw'+(i===prof.color?' on':'');d.style.background='#'+new THREE.Color(c).getHexString();d.style.outline=ask?'3px solid #4fd67a':'';d.textContent=owned?'':(ask?'¿'+COLOR_PRICE+'?':'🔒');d.title=owned?'':COLOR_PRICE+' monedas';d.onclick=()=>shopClick('color',i,COLOR_PRICE,owned,()=>prof.color=i);$('colors').appendChild(d)});
  updBtns();
  if(!keepPreview)refreshPreview();updStats();
}
function updStats(){$('stats').textContent=`Partidas: ${prof.played} · Coronas: ${prof.wins} 👑 · Logros: ${Object.keys(prof.ach).length}/${ACH.length}`}

// ---------- cámara ----------
function updCam(dt){
  let t=G.player;
  if(t.out||t.gone){if(!G.spect||G.spect.out){G.spect=G.parts.find(e=>!e.out)||t}t=G.spect;$('spect').style.display='block';$('spect').textContent='👀 Mirando a '+t.name}
  const k=1-Math.exp(-6*dt);
  camT.x+=(t.x-camT.x)*k;camT.y+=(Math.max(t.y,-16)-camT.y)*k;camT.z+=(t.z-camT.z)*k;
  const o=G.def.cam;
  const want=new THREE.Vector3(camT.x*(G.def.kind==='race'?.6:.75)+o[0],camT.y+o[1],camT.z+o[2]);
  if(snapCam){cam.position.copy(want);snapCam=false}else cam.position.lerp(want,k);
  cam.lookAt(camT.x,camT.y+1,camT.z-3);
  if(shake>0){cam.position.x+=rnd(-1,1)*shake;cam.position.y+=rnd(-1,1)*shake;shake=Math.max(0,shake-dt*1.6)}
  sun.position.set(camT.x+10,camT.y+24,camT.z+8);sun.target.position.set(camT.x,camT.y,camT.z-4);
}

// ---------- bucle ----------
function update(dt){
  if(G.state==='menu'||G.state==='result'||G.paused)return;
  G.t+=dt;
  if(banT>0){banT-=dt;if(banT<=0)$('banner').classList.remove('on')}
  if(G.state==='podium'){for(const e of G.podium){if(!e.emote&&Math.random()<dt*.8)doEmote(e,e===G.podium[0]?'fiesta':pick(['hola','baile']));e.ground=true;animEnt(e,dt)}updConf(dt);updPart(dt);if(Math.random()<dt*1.2&&G.podium[0])confetti(rnd(-3,3),5,rnd(-1,1));return}
  if(G.state==='howto'){G.howT-=dt;if(G.howT<=0)beginCount()}
  else if(G.state==='count'){
    G.count-=dt;const c=Math.ceil(G.count);
    if(G.count<3&&c<G.lastBeep&&c>0){G.lastBeep=c;banner(String(c),'',.8);sfx('beep')}
    if(G.count<=0){G.state='play';banner('¡YA!','',.8);sfx('go')}
  }else if(G.state==='play')G.rt+=dt;
  else if(G.state==='end'){G.endT-=dt;if(G.endT<=0){showResult();return}}
  for(const o of obs){if(o.type==='capsule'){o.pa=o.a;o.pb=o.b;o.dt=dt}o.upd&&o.upd(G.t,dt)}
  obs=obs.filter(o=>!o.dead);
  for(const p of plats){
    if(p.bob!==undefined){const nt=p.base+Math.sin(G.t*1.6+p.bob)*.55;p.dy=nt-p.top;p.top=nt;p.mesh.position.y=nt-p.h/2}
    if(p.mv){const nx=Math.sin(G.t*p.mv.sp+p.mv.ph)*p.mv.amp;p.dx=nx-p.x;p.x=nx;p.mesh.position.x=nx}
  }
  if(G.def.id==='tiles')updTiles(dt);
  if(G.def.id==='hill')updZone(dt);
  if(G.state==='play'){
    playerInput(dt);
    for(const e of G.parts){if(!e.bot||e.out)continue;G.def.bot(e,dt)}
  }
  for(const e of G.parts){if(e.out)continue;physEnt(e,dt);for(const o of obs)if(o.type!=='spawner'&&o.type!=='meteor')collideObs(e,o)}
  entCollide();
  if(G.state==='play')roundLogic(dt);
  for(const e of G.parts)if(!e.out)animEnt(e,dt);
  marker.position.y=1.9+Math.sin(G.t*4)*.12;marker.rotation.y+=dt*3;
  updConf(dt);updPart(dt);updCam(dt);updArrow();updProg();
  if(Math.floor(G.t*4)!==Math.floor((G.t-dt)*4))updHud();
}
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.fov=w<h?78:60;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
applyQ();
let last=performance.now(),perfAcc=0,perfN=0,autoQ=false;
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000,dt=Math.min(.05,raw);last=now;
  if(G.state==='menu'){if(pChar){pChar.rotation.y+=dt*1.2;pChar.userData.body.position.y=Math.abs(Math.sin(now/300))*.12}PR.render(pScene,pCam);return}
  // si el aparato va lento, bajamos la calidad automáticamente una vez
  if(G.state==='play'&&!document.hidden&&raw<.5){perfAcc+=raw;perfN++;if(perfN>=120){const avg=perfAcc/perfN;perfAcc=perfN=0;if(avg>.034&&!autoQ&&cfg.q!=='baja'){autoQ=true;cfg.q=cfg.q==='alta'?'media':'baja';saveCfg();applyQ();updBtns();toast('⚙️ Calidad '+QN[cfg.q]+' para ir más fluido')}}}
  let acc=dt;while(acc>0){const s=Math.min(acc,1/60);update(s);acc-=s}
  R.render(scene,cam);
}
buildMenu();requestAnimationFrame(frame);

window.__game={G,start:startGame,load:loadRound,go:beginCount,step(n=1){for(let i=0;i<n;i++)update(1/60);R.render(scene,cam)},plats:()=>plats,obs:()=>obs,prof,RDEF,R,cam,scene,confetti};
})();
</script>
</body>
