    while(st.length){const i=st.pop(),x=i%MW,y=(i/MW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const j=(y+dy)*MW+x+dx;

  const m=dm(f),s=f.ch.su;
  switch(s.k){
    case'ring':for(let i=0;i<s.n;i++)shoot(f,i*2*PI/s.n,s.spd,s.rng,s.dmg*m,s.r,s.vis,{sup:true,slow:!!s.slow});break;
    case'volley':shotsFrom(f,s,ang,m,true);break;
    case'orb':shoot(f,ang,s.spd,s.rng,s.dmg*m,s.r,s.vis,{pierce:true,sup:true});break;
    case'turret':{let x=f.x+Math.cos(ang)*40,y=f.y+Math.sin(ang)*40;if(solidAt(x,y)){x=f.x;y=f.y;}
      G.turrets.push({x,y,own:f,team:f.team,hp:2600,maxHp:2600,t:0,life:15,cd:.5,ang,dead:false,r:20,pet:false});break;}
    case'pets':for(let k=0;k<s.n;k++){const a2=ang+(k?.6:-.6);let x=f.x+Math.cos(a2)*30,y=f.y+Math.sin(a2)*30;if(solidAt(x,y)){x=f.x;y=f.y;}
      G.turrets.push({x,y,own:f,team:f.team,hp:1400,maxHp:1400,t:0,life:10,cd:0,ang:a2,dead:false,r:14,pet:true});}break;
    case'zone':if(s.lob){const p=lobTarget(f,ang,dist,s.rng);lob(f,p.x,p.y,0,s.rad,{vis:s.vis,sup:true,zone:{r:s.rad,dur:s.dur,dmg:(s.dmg||0)*m,slow:!!s.slow,vis:s.vis}});}
      else G.zones.push({x:f.x,y:f.y,r:s.rad,t:0,dur:s.dur,tick:0,own:f,team:f.team,dmg:(s.dmg||0)*m,heal:s.heal||0,slow:!!s.slow,vis:s.vis,follow:f});break;
    case'dash':f.dashT=s.dist/900;f.dashA=ang;f.dashHit=new Set();f.dashDmg=s.dmg*m;break;
    case'shock':for(const e of enemiesOf(f)){const d=hyp(e.x-f.x,e.y-f.y);if(d<s.rad+e.r){damage(e,s.dmg*m,f,true);push(e,f,90);}}
      for(const tu of G.turrets)if(!tu.dead&&tu.team!==f.team&&hyp(tu.x-f.x,tu.y-f.y)<s.rad)damageTurret(tu,s.dmg*m);
      G.rings.push({x:f.x,y:f.y,r:s.rad,t:0,col:'#c9a27a'});if(isH(f))G.shake[f.pi]=.35;break;
    case'lob':{const p=lobTarget(f,ang,dist,s.rng);lob(f,p.x,p.y,s.dmg*m,s.rad,{vis:s.vis,sup:true,big:true,heal:s.heal||0});break;}
    case'multilob':{const p=lobTarget(f,ang,dist,s.rng);for(let k=0;k<s.n;k++){const a2=Math.random()*PI*2,r2=k?30+Math.random()*90:0;
      G.lobs.push({sx:f.x,sy:f.y,x:f.x,y:f.y,tx:clamp(p.x+Math.cos(a2)*r2,T,WW-T),ty:clamp(p.y+Math.sin(a2)*r2,T,WH-T),t:-k*.07,dur:.6,own:f,team:f.team,dmg:s.dmg*m,rad:s.rad,sup:true,vis:s.vis});}break;}
    case'mines':for(let k=0;k<s.n;k++){const a2=ang+(k-1)*.9;let x=f.x+Math.cos(a2)*70,y=f.y+Math.sin(a2)*70;if(solidAt(x,y)){x=f.x;y=f.y;}
      G.mines.push({x,y,own:f,team:f.team,dmg:s.dmg*m,rad:s.rad,t:0});}break;
    case'spin':f.spinT=s.dur;f.spinTick=0;f.spinDmg=s.dmg*m;f.spinRad=s.rad;break;
    case'leap':{const p=lobTarget(f,ang,dist,s.rng);f.leap={sx:f.x,sy:f.y,tx:p.x,ty:p.y,t:0,dur:.7,dmg:s.dmg*m,rad:s.rad};f.dashT=0;f.spinT=0;break;}
    case'wall':{const cx=f.x+Math.cos(ang)*90,cy=f.y+Math.sin(ang)*90,px=-Math.sin(ang),py=Math.cos(ang);
      for(const k of[-1,0,1]){const tx=Math.floor((cx+px*k*T)/T),ty=Math.floor((cy+py*k*T)/T),i=ty*MW+tx;
        if(tx<1||ty<1||tx>=MW-1||ty>=MH-1||grid[i]!==0)continue;const X=tx*T+T/2,Y=ty*T+T/2;
        if(G.fighters.some(e=>!e.dead&&Math.abs(e.x-X)<T/2+e.r&&Math.abs(e.y-Y)<T/2+e.r))continue;
        grid[i]=3;crates.set(i,{hp:1400,max:1400,gold:false,cream:true});G.walls.push({i,t:0});burst(X,Y,'#fff3e0',10,140);}break;}
    case'grow':{f.bigT=s.dur;f.r=30;const h=Math.round(Math.min(f.maxHp*.3,f.maxHp-f.hp));f.hp+=h;if(h>0)addText(f.x,f.y-60,'+'+h,'#7dff7a',20);burst(f.x,f.y,'#e63970',24,200);break;}
    case'moons':f.moonT=s.dur;f.moonDmg=s.dmg*m;f.moonHit=new Map();break;
  }
  if(nearH(f))snd(440,.35,'sawtooth',.07,1320);if(isH(f))G.shake[f.pi]=Math.max(G.shake[f.pi],.25);return true;}
function gadgetF(f){
  if(f.dead||f.gad<=0||G.t<G.start)return false;f.gad--;f.gadUsed++;
  switch(f.ch.gd){
    case'shield':f.shield=2.5;burst(f.x,f.y,'#ff9f1a',16,180);break;
    case'heal':{const h=Math.round(Math.min(f.maxHp*.35,f.maxHp-f.hp));f.hp+=h;addText(f.x,f.y-60,'+'+h,'#7dff7a',20);burst(f.x,f.y,'#7dff7a',16,140);break;}
    case'dash':f.dashT=.22;f.dashA=f.mvA;f.dashHit=null;burst(f.x,f.y,'#4ff0ff',12,160);break;
    case'speed':f.speedT=3;burst(f.x,f.y,'#6cc6ff',16,160);break;
    case'invis':f.invisT=3;burst(f.x,f.y,'#8a7fb0',18,140);break;
    case'reload':f.ammo=3;f.cd=0;addText(f.x,f.y-60,'¡RECARGA!','#ffe066',18);burst(f.x,f.y,'#ffe066',12,140);break;
  }
  if(nearH(f))snd(600,.2,'triangle',.07,900);return true;}
function autoTarget(f,range){let best=null,bd=range;
  for(const e of G.fighters){if(e.team===f.team||e.dead||!visible(f,e))continue;const d=hyp(e.x-f.x,e.y-f.y);if(d<bd){bd=d;best=e;}}
  for(const tu of G.turrets){if(tu.team===f.team||tu.dead)continue;const d=hyp(tu.x-f.x,tu.y-f.y);if(d<bd){bd=d;best=tu;}}
  return best;}
function autoFire(f,isSup){const rng=isSup?Math.max(supRange(f),200):atkRange(f);const t=autoTarget(f,rng*1.15+30);let ang=f.face,dist=null;
  if(t){ang=Math.atan2(t.y-f.y,t.x-f.x);dist=hyp(t.x-f.x,t.y-f.y);}return isSup?superF(f,ang,dist):fireF(f,ang,dist);}

// ================= daño =================
function addText(x,y,txt,col,sz){G.texts.push({x,y,txt,col,life:.9,sz:sz||18});}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*PI*2,s=(.3+Math.random())*(sp||150);
  G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5+Math.random()*.4,max:.9,col,sz:3+Math.random()*4});}}
function push(e,from,dist){const a=Math.atan2(e.y-from.y,e.x-from.x);e.x+=Math.cos(a)*dist;e.y+=Math.sin(a)*dist;collide(e);}
function damage(f,amt,src,noCharge){
  if(f.dead||f.prot>0||f.leap)return;if(f.shield>0)amt*=.4;if(f.bigT>0)amt*=.5;amt=Math.round(amt);f.hp-=amt;f.lastHurt=G.t;
  addText(f.x+(Math.random()-.5)*20,f.y-34,amt,isH(f)?'#ff5a5a':'#ffffff');burst(f.x,f.y,'#fff',4,120);
  if(src&&src!==f&&!noCharge&&!src.dead)src.sup=Math.min(1,src.sup+amt/src.ch.need);
  if(isH(f)){snd(140,.1,'square',.06,80);G.shake[f.pi]=Math.max(G.shake[f.pi],.12);}else if(src&&isH(src))snd(660,.05,'square',.04);
  if(isH(f))f.minHp=Math.min(f.minHp,Math.max(0,f.hp)/f.maxHp);
  if(f.hp<=0)kill(f,src);}
function damageTurret(tu,amt){tu.hp-=amt;addText(tu.x,tu.y-28,Math.round(amt),'#ddd',15);if(tu.hp<=0&&!tu.dead){tu.dead=true;burst(tu.x,tu.y,'#9ab',18,200);}}
function hitCrate(tx,ty,amt){const i=ty*MW+tx;if(grid[i]!==3)return;const c=crates.get(i);if(!c)return;c.hp-=amt;
  const X=tx*T+T/2,Y=ty*T+T/2;burst(X,Y,c.gold?'#ffd23f':'#c98a4b',3,100);
  if(c.hp<=0){grid[i]=0;crates.delete(i);burst(X,Y,c.gold?'#ffd23f':'#a0642c',c.gold?30:16,240);
    if(c.cream){}else if(G.mode==='solo'){const n=c.gold?3:1;for(let k=0;k<n;k++){const a=k/n*PI*2;G.picks.push({x:X+(n>1?Math.cos(a)*22:0),y:Y+(n>1?Math.sin(a)*22:0),t:0});}}
    else{G.items.push({x:X,y:Y,k:'heal',t:0});if(c.gold)G.items.push({x:X+20,y:Y,k:'speed',t:0});}
    if(nearH({x:X,y:Y}))snd(180,.15,'triangle',.06,90);}}
function kill(f,src){
  f.dead=true;f.hp=0;f.spinT=0;f.dashT=0;f.leap=null;f.bigT=0;f.r=22;f.moonT=0;burst(f.x,f.y,'#ffd23f',26,260);burst(f.x,f.y,'#ff6b6b',14,200);
  if(G.mode==='solo'){const n=Math.max(1,f.cubes);for(let i=0;i<n;i++){const a=i/n*PI*2;G.picks.push({x:f.x+Math.cos(a)*(n>1?28:0),y:f.y+Math.sin(a)*(n>1?28:0),t:0});}}
  else{for(let i=0;i<f.gems;i++){const a=Math.random()*PI*2,s=60+Math.random()*120;G.gems.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0});}f.gems=0;f.resp=4;}
  if(src&&src!==f)src.kills++;
  G.feed.push({txt:src?`${src.name} eliminó a ${f.name}`:`${G.mode==='solo'?'El gas':'La lava'} eliminó a ${f.name}`,life:4,me:isH(f)||(src&&isH(src))});
  if(src&&isH(src))snd(880,.25,'square',.06,1760);if(isH(f))snd(300,.6,'sawtooth',.08,60);
  for(const tu of G.turrets)if(tu.own===f)tu.dead=true;
  for(const z of G.zones)if(z.follow===f)z.t=z.dur;
  if(G.mode==='solo'){const left=alive();if(isH(f))f.place=left.length+1;if(left.length===1&&isH(left[0]))left[0].place=1;
    if(G.endT<0&&(left.length<=1||!G.humans.some(h=>!h.dead)))G.endT=G.t+2;}
}
function respawn(f){f.dead=false;f.x=f.sx;f.y=f.sy;f.hp=f.maxHp;f.ammo=3;f.prot=2;f.vx=f.vy=0;f.slow=0;f.shield=0;f.speedT=0;f.dashT=0;f.invisT=0;f.spinT=0;f.leap=null;f.bigT=0;f.r=22;f.moonT=0;
  f.ai.tgt=null;f.ai.goal=null;burst(f.x,f.y,'#fff',14,160);}

// ================= movimiento =================
function moveF(f,mx,my,dt){if(f.leap)return;let l=hyp(mx,my);if(l>1){mx/=l;my/=l;l=1;}
  const sp=f.ch.spd*(f.slow>0?.6:1)*(f.speedT>0?1.5:1)*(f.spinT>0?1.25:1);let dx=mx*sp,dy=my*sp;
  if(f.dashT>0){dx=Math.cos(f.dashA)*900;dy=Math.sin(f.dashA)*900;}
  else if(tileOf(f.x,f.y)===4){const k=Math.min(1,dt*2.2);dx=f.vx+(dx-f.vx)*k;dy=f.vy+(dy-f.vy)*k;}
  f.x+=dx*dt;f.y+=dy*dt;collide(f);f.vx=dx;f.vy=dy;
  if(l>.1){f.mvA=Math.atan2(my,mx);if(G.t-f.lastAttack>.4&&f.dashT<=0)f.face=f.mvA;}}
function common(f,dt){
  if(f.ammo<3)f.ammo=Math.min(3,f.ammo+dt/f.ch.reload);f.cd-=dt;f.slow-=dt;f.shield-=dt;f.speedT-=dt;f.prot-=dt;f.gadCd-=dt;f.invisT-=dt;
  if(f.dashT>0){f.dashT-=dt;if(f.dashHit){for(const e of enemiesOf(f)){if(f.dashHit.has(e)||hyp(e.x-f.x,e.y-f.y)>f.r+e.r+8)continue;f.dashHit.add(e);damage(e,f.dashDmg,f,true);push(e,f,70);}
      if(Math.random()<.6)G.parts.push({x:f.x,y:f.y,vx:0,vy:0,life:.25,max:.25,col:'#fff6',sz:12});
      if(f.ch.su.trail){f.trailT-=dt;if(f.trailT<=0){f.trailT=.06;G.zones.push({x:f.x,y:f.y,r:34,t:0,dur:2.2,tick:.2,own:f,team:f.team,dmg:140*dm(f),heal:0,slow:false,vis:'coal'});}}}
    if(f.dashT<=0)f.dashHit=null;}
  if(f.spinT>0){f.spinT-=dt;f.spinTick-=dt;if(f.spinTick<=0){f.spinTick=.25;for(const e of enemiesOf(f))if(hyp(e.x-f.x,e.y-f.y)<f.spinRad+e.r)damage(e,f.spinDmg,f,true);
      for(const tu of G.turrets)if(!tu.dead&&tu.team!==f.team&&hyp(tu.x-f.x,tu.y-f.y)<f.spinRad)damageTurret(tu,f.spinDmg);}}
  if(f.leap){const L=f.leap;L.t+=dt;const k=Math.min(1,L.t/L.dur);f.x=L.sx+(L.tx-L.sx)*k;f.y=L.sy+(L.ty-L.sy)*k;
    if(k>=1){f.leap=null;collide(f);for(const e of enemiesOf(f))if(hyp(e.x-f.x,e.y-f.y)<L.rad+e.r){damage(e,L.dmg,f,true);push(e,f,60);}
      for(const tu of G.turrets)if(!tu.dead&&tu.team!==f.team&&hyp(tu.x-f.x,tu.y-f.y)<L.rad)damageTurret(tu,L.dmg);
      const bx=Math.floor(f.x/T),by=Math.floor(f.y/T);for(let ty=by-3;ty<=by+3;ty++)for(let tx=bx-3;tx<=bx+3;tx++)if(tileAt(tx,ty)===3&&hyp(tx*T+T/2-f.x,ty*T+T/2-f.y)<L.rad+24)hitCrate(tx,ty,L.dmg);
      G.rings.push({x:f.x,y:f.y,r:L.rad,t:0,col:'#ffb347'});burst(f.x,f.y,'#ffb347',24,260);if(nearH(f))snd(120,.25,'square',.08,50);if(isH(f))G.shake[f.pi]=.35;}}
  if(f.bigT>0){f.bigT-=dt;if(f.bigT<=0){f.r=22;collide(f);}}
  if(f.moonT>0){f.moonT-=dt;f.moonA+=dt*3.2;for(let k=0;k<4;k++){const a=f.moonA+k*PI/2,mx=f.x+Math.cos(a)*75,my=f.y+Math.sin(a)*75;
    for(const e of enemiesOf(f)){if(hyp(e.x-mx,e.y-my)>e.r+12)continue;if(G.t-(f.moonHit.get(e)||-9)<.4)continue;f.moonHit.set(e,G.t);damage(e,f.moonDmg,f,true);}}}
  for(let i=f.pend.length-1;i>=0;i--){const p=f.pend[i];p.t-=dt;if(p.t<=0){f.pend.splice(i,1);if(!f.dead)shotsFrom(f,Object.assign({},f.ch.atk,{n:1}),p.ang,dm(f));}}
  if(G.t-f.lastHurt>3&&G.t-f.lastAttack>3&&f.hp<f.maxHp)f.hp=Math.min(f.maxHp,f.hp+f.maxHp*.13*dt);
  if(inGas(f)){f.gasT+=dt;if(f.gasT>=.5){f.gasT=0;damage(f,450,null,true);}}else f.gasT=0;
  if(f.dead)return;
  if(tileOf(f.x,f.y)===5&&f.dashT<=0&&!f.leap){f.lavaT+=dt;if(f.lavaT>=.4){f.lavaT=0;damage(f,320,null,true);burst(f.x,f.y+16,'#ff7a1a',5,90);}}else f.lavaT=0;
  if(f.dead)return;
  if(f.speedT>0&&Math.random()<.4)G.parts.push({x:f.x,y:f.y+14,vx:0,vy:0,life:.3,max:.3,col:'#bfe8ff',sz:5});
  if(isH(f)){const r=f.sup>=1;if(r&&!f.supReady)jingle([12,16,19],.06,'triangle');f.supReady=r;}
  for(let i=G.picks.length-1;i>=0;i--){const p=G.picks[i];if(p.t>.3&&hyp(p.x-f.x,p.y-f.y)<f.r+16){G.picks.splice(i,1);
    f.cubes++;f.maxHp+=400;f.hp+=400;f.dmgMul=1+.1*f.cubes;addText(f.x,f.y-50,'+1 ⬢','#7dff7a',20);if(isH(f))snd(660,.18,'triangle',.07,1320);}}
  for(let i=G.items.length-1;i>=0;i--){const p=G.items[i];if(p.t>.3&&hyp(p.x-f.x,p.y-f.y)<f.r+18){G.items.splice(i,1);
    if(p.k==='heal'){const h=Math.round(Math.min(1500,f.maxHp-f.hp));f.hp+=h;addText(f.x,f.y-50,'+'+h,'#7dff7a',20);burst(f.x,f.y,'#7dff7a',10,120);}
    else{f.speedT=4;addText(f.x,f.y-50,'¡VELOZ!','#ffe066',20);}
    if(isH(f))snd(520,.2,'triangle',.07,1040);}}
  for(let i=G.gems.length-1;i>=0;i--){const g=G.gems[i];if(g.t>.4&&hyp(g.x-f.x,g.y-f.y)<f.r+16){G.gems.splice(i,1);f.gems++;
    if(isH(f))snd(990,.12,'triangle',.06,1480);}}
}

// ================= IA =================
function randomFloor(inSafe){for(let i=0;i<40;i++){const tx=1+rnd(MW-2),ty=1+rnd(MH-2);if(grid[ty*MW+tx]!==0)continue;const p=tc(tx,ty);
  if(inSafe&&G.mode==='solo'&&(Math.abs(p.x-WW/2)>G.safe-T*2||Math.abs(p.y-WH/2)>G.safe-T*2))continue;return p;}return{x:WW/2,y:WH/2};}
function nearestTile(b,type,maxD){let best=null,bd=maxD;const r=Math.ceil(maxD/T),bx=Math.floor(b.x/T),by=Math.floor(b.y/T);
  for(let y=by-r;y<=by+r;y++)for(let x=bx-r;x<=bx+r;x++){if(tileAt(x,y)!==type)continue;const p=tc(x,y),d=hyp(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=p;}}return best;}
function botAI(b,dt){
  const a=b.ai,t=G.t,D=G.D,gm=G.mode==='gems',ch=b.ch;a.think-=dt;a.aimDelay-=dt;
  if(a.tgt&&a.tgt.dead)a.tgt=null;
  const tot=gm?teamGems(b.team):0,carrier=gm&&b.gems>0&&(tot>=10||(b.gems>=4&&b.hp<b.maxHp*.5));
  if(a.think<=0){
    a.think=.2+Math.random()*.2;let best=null,bd=1e9;
    for(const f of G.fighters){if(f.team===b.team||f.dead)continue;const d=hyp(f.x-b.x,f.y-b.y);if(d<680&&d<bd&&visible(b,f)){best=f;bd=d;}}
    for(const tu of G.turrets){if(tu.team===b.team||tu.dead)continue;const d=hyp(tu.x-b.x,tu.y-b.y);if(d<420&&d<bd){best=tu;bd=d;}}
    if(best&&best!==a.tgt)a.aimDelay=D.react*(.7+Math.random()*.6);a.tgt=best;a.goal=null;
    let it=null,id=350;for(const p of G.items){const d=hyp(p.x-b.x,p.y-b.y);if(d<id&&(p.k==='speed'||b.hp<b.maxHp*.8)){id=d;it=p;}}
    if(gm){
      if(carrier)a.goal={x:b.sx,y:b.sy,k:'home'};
      else if(it&&!best)a.goal={x:it.x,y:it.y,k:'item'};
      else{let g=null,gd=1e9;for(const q of G.gems){const d=hyp(q.x-b.x,q.y-b.y);if(d<gd){gd=d;g=q;}}
        a.goal=g?{x:g.x,y:g.y,k:'gem'}:{x:WW/2+Math.cos(b.id*1.7)*90,y:WH/2+Math.sin(b.id*1.7)*90,k:'mine'};}
    }else if(!best){
      let pk=null,pd=520;for(const p of G.picks){const d=hyp(p.x-b.x,p.y-b.y);if(d<pd){pd=d;pk=p;}}
      if(it)a.goal={x:it.x,y:it.y,k:'item'};
      else if(pk)a.goal={x:pk.x,y:pk.y,k:'pick'};

    const after=lvlOf(h.c),who=G.nH===2?`${h.name} (${CHARS[h.c].name})`:CHARS[h.c].name;
    lines.push(`${who}: ${solo?`puesto ${h.place||'?'}º`:won?'victoria':'derrota'} · ✖ ${h.kills} ${solo?`· ⬢ ${h.cubes}`:''} · <b class="new">+${tr} 🏆 · +${gm} 💎</b>`+(after>before?` · <b class="new">¡Sube a nivel ${after}!</b>`:''));
    const got=id=>{const a=grant(id);if(a)newA.push(a);};
    if(solo&&won)got('win1');if(h.kills>=3)got('kills3');if(h.cubes>=8)got('cubes8');if(solo&&won&&h.minHp>=.5)got('intocable');
    if(!solo&&won)got('gems');if(solo&&won&&cfg.diff===2)got('leyenda');if(Object.keys(prof.wins).length>=4)got('maestro');
    if(prof.sup>=25)got('super');if(prof.gad>=20)got('gadget');if(MAPS.every(m=>prof.maps[m]))got('explorador');if(CKEYS.some(c=>lvlOf(c)>=5))got('nivel5');if(G.nH===2)got('duo');
  }
  saveProf();
  let title;
  if(G.nH===1){const h=G.humans[0];title=solo?(h.place===1?'🏆 ¡GANASTE!':`Puesto ${h.place}º`):(G.winner===h.team?'🏆 ¡VICTORIA!':'DERROTA');}
  else if(solo){const[a,b]=G.humans;const best=(a.place||9)<(b.place||9)?a:b;title=best.place===1?`🏆 ¡Gana ${best.name}!`:`${best.name} llega más lejos`;}
  else title=`🏆 ¡Gana ${G.humans.find(h=>h.team===G.winner).name}!`;
  const won=G.humans.some(h=>solo?h.place===1:G.winner===h.team);jingle(won?[0,4,7,12,16,19,24]:[12,7,4,0,-5],won?.1:.16,won?'square':'triangle');
  const nextC=CKEYS.filter(k=>!prof.owned[k]).sort((a,b)=>priceOf(a)-priceOf(b))[0];
  $('endT').textContent=title;
  $('endS').innerHTML=lines.join('<br>')+(newA.length?`<br><span class="new">🏅 Nuevo logro: ${newA.join(', ')} (+${ACH_GEMS*newA.length} 💎)</span>`:'')+
    `<br>Tienes 💎 ${prof.gems} gemas`+(nextC?(prof.gems>=priceOf(nextC)?` · <span class="new">¡Ya puedes comprar a ${CHARS[nextC].name}!</span>`:` · ${CHARS[nextC].name} cuesta 💎 ${priceOf(nextC)}`):'')+
    `<br><small>${THEMES[G.th].n} · Robots ${G.D.n}</small>`;
  show('end');}
buildMenu();
document.fonts&&document.fonts.ready.then(buildMenu);

// gancho para pruebas
window.__game={step(n){for(let i=0;i<n;i++)update(DT);draw();},get G(){return G},start(o){Object.assign(cfg,o||{});startGame();},cfg,prof,CHARS};
</script>
