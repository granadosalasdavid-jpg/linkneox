<style>
  :root{--bg:#1b1033;--card:#2c1c52;--acc:#ffd23f;--txt:#fff}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:"Lilita One",system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  #ui{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none}
  @media (orientation:portrait){
    #ui{width:100vh;height:100vw;transform:rotate(90deg) translateY(-100%);transform-origin:top left}
  }
  .scr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:1.4vmin;pointer-events:auto;
    background:radial-gradient(circle at 50% 30%,#4a2a8a,#1b1033 70%);padding:2vmin 16px;box-sizing:border-box;overflow:auto;touch-action:pan-y}
  .scr>:first-child{margin-top:auto}.scr>:last-child{margin-bottom:auto}
  .scr.dim{background:rgba(20,10,40,.86)}
  .hide{display:none!important}
  h1{margin:0;font-size:8.5vmin;line-height:.9;letter-spacing:1px;color:var(--acc);text-shadow:0 .6vmin 0 #c0392b,0 1.2vmin 0 #0006;text-align:center}
  h1 span{display:block;font-size:5vmin;color:#fff;text-shadow:0 .5vmin 0 #3b1f6e}
  h2{margin:0;font-size:10vmin;color:var(--acc);text-shadow:0 .8vmin 0 #c0392b;text-align:center}
  .cols{display:flex;gap:4vmin;align-items:center;justify-content:center;flex-wrap:wrap;max-width:100%}
  .colL,.colR{display:flex;flex-direction:column;align-items:center;gap:1.3vmin}
  .opt{display:flex;flex-direction:column;align-items:center;gap:.6vmin}
  .opt label{font-size:2.6vmin;opacity:.75;letter-spacing:.5px}
  .chips{display:flex;gap:1vmin;flex-wrap:wrap;justify-content:center}
  .chips b{font-weight:normal;font-size:3vmin;padding:.8vmin 2vmin;border-radius:2vmin;background:#3a2768;border:.4vmin solid #4b3480;cursor:pointer}
  .chips b.on{background:var(--acc);color:#3b1f00;border-color:#fff3}
  .note{font-size:2.5vmin;opacity:.8;text-align:center;max-width:62vmin;margin:0;min-height:5vmin}
  #cards{display:flex;gap:1.6vmin;flex-wrap:wrap;justify-content:center}
  .card{position:relative;background:var(--card);border:.6vmin solid #4b3480;border-radius:2.5vmin;padding:.8vmin 1.2vmin;text-align:center;cursor:pointer;transition:transform .12s}
  .card canvas{width:13vmin;height:13vmin;display:block;margin:auto}
  .card b{display:block;font-weight:normal;font-size:3vmin}
  .card small{display:block;font-size:2.2vmin;opacity:.85}
  .card.on{border-color:var(--acc);transform:translateY(-.8vmin) scale(1.05);box-shadow:0 0 3vmin #ffd23f66}
  .card i{position:absolute;top:-1.6vmin;font-style:normal;font-size:2.2vmin;padding:.2vmin 1vmin;border-radius:1vmin;background:#33ccff;color:#002}
  .card i.p2{background:#ff7ad9;right:-1vmin}.card i.p1{left:-1vmin}
  #info{font-size:2.7vmin;text-align:center;max-width:70vmin;min-height:9vmin;line-height:1.25}
  #info em{color:var(--acc);font-style:normal}
  #ptabs{display:flex;gap:1vmin}
  #ptabs b{font-weight:normal;font-size:2.8vmin;padding:.5vmin 2vmin;border-radius:1.5vmin;background:#3a2768;cursor:pointer}
  #ptabs b.on.t0{background:#33ccff;color:#002}#ptabs b.on.t1{background:#ff7ad9;color:#200}
  button{font-family:inherit;font-size:5vmin;padding:1.2vmin 6vmin;border:0;border-radius:3vmin;background:var(--acc);color:#3b1f00;
    box-shadow:0 1vmin 0 #c48a00;cursor:pointer}
  button:active{transform:translateY(.6vmin);box-shadow:0 .4vmin 0 #c48a00}
  button.sec{background:#6c5ce7;color:#fff;box-shadow:0 1vmin 0 #3d2fa8;font-size:3.4vmin;padding:1vmin 3vmin}
  .row{display:flex;gap:2vmin;align-items:center;flex-wrap:wrap;justify-content:center}
  #endS{font-size:3.3vmin;text-align:center;line-height:1.45;max-width:110vmin}
  #endS .new{color:var(--acc)}
  #achList{display:grid;grid-template-columns:repeat(auto-fill,minmax(40vmin,1fr));gap:1.4vmin;width:min(110vmin,100%)}
  .ach{background:var(--card);border-radius:2vmin;padding:1.2vmin 2vmin;opacity:.55;font-size:2.8vmin}
  .ach.got{opacity:1;border:.4vmin solid var(--acc)}
  .ach small{display:block;font-size:2.3vmin;opacity:.8}
</style>

<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="menu" class="scr">
    <div class="cols">
      <div class="colL">
        <h1>CHISPAZO<span>ARENA</span></h1>
        <div id="opts"></div>
        <p class="note" id="modeInfo"></p>
        <div class="row"><button class="sec" id="bAch">🏅 Logros</button><button class="sec" id="bMus"></button><button class="sec" id="bSfx"></button></div>
      </div>
      <div class="colR">
        <div id="ptabs"></div>
        <div id="cards"></div>
        <div id="info"></div>
        <button id="play">¡A JUGAR!</button>
      </div>
    </div>
  </div>
  <div id="pause" class="scr dim hide">
    <h2>PAUSA</h2>
    <button id="resume">SEGUIR</button>
    <div class="row"><button class="sec" id="pMus"></button><button class="sec" id="pSfx"></button><button class="sec" id="quit">SALIR AL MENÚ</button></div>
  </div>
  <div id="achs" class="scr hide">
    <h2>LOGROS</h2>
    <div id="achList"></div>
    <button id="achBack">VOLVER</button>
  </div>
  <div id="end" class="scr hide">
    <h2 id="endT"></h2>
    <div id="endS"></div>
    <div class="row"><button id="again">OTRA VEZ</button><button id="change" class="sec">MENÚ</button></div>
  </div>
</div>
<script>
"use strict";
// ================= pantalla =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let dpr=1,W=0,H=0,rot=false;
function resize(){dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  rot=innerHeight>innerWidth;W=rot?innerHeight:innerWidth;H=rot?innerWidth:innerHeight;}
addEventListener('resize',resize);resize();
const FONT='"Lilita One",system-ui,sans-serif';
const PI=Math.PI,rnd=n=>Math.floor(Math.random()*n),hyp=Math.hypot,clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const DT=1/60,T=48,MW=32,MH=32,WW=MW*T,WH=MH*T;

// ================= datos =================
const CHARS={
  brasa:{name:'BRASA',desc:'Dragoncito de fuego. Lanza <em>3 bolas de fuego</em> en abanico.',sup:'Súper: <em>Anillo de fuego</em> en todas direcciones.',gad:'Escudo de brasas',gdesc:'recibe mucho menos daño un momento',hp:3800,spd:175,rng:270,reload:1.2,need:3800,spdB:560},
  pincho:{name:'PINCHO',desc:'Cactus francotirador. Dispara <em>un pincho muy lejos</em>.',sup:'Súper: <em>Lluvia de pinchos</em> que atraviesan.',gad:'Savia curativa',gdesc:'se cura un buen trozo de vida',hp:2900,spd:165,rng:540,reload:1.6,need:3100,spdB:950},
  tuerca:{name:'TUERCA',desc:'Robot con mucha vida. Dispara <em>2 tornillos</em> seguidos.',sup:'Súper: <em>Torreta</em> que dispara sola.',gad:'Turbo',gdesc:'sale disparado hacia delante',hp:4300,spd:160,rng:380,reload:1.25,need:3600,spdB:720},
  gota:{name:'GOTA',desc:'Gotita traviesa. Lanza <em>globos de agua</em> por encima de los muros.',sup:'Súper: <em>Tormenta</em> que moja y frena.',gad:'Corriente',gdesc:'corre mucho más rápido unos segundos',hp:3200,spd:182,rng:340,reload:1.5,need:2800,spdB:600}
};
const CKEYS=Object.keys(CHARS);
const SUPR={brasa:300,pincho:600,tuerca:200,gota:380};
const BOTN=['ROBI','ZAS','MOCHO','PIPA','LALO','TITO','NENA','CHUS','BUBU','KIKO','PEPA','TOTO'];
const DIFF=[
  {n:'Fácil',aim:.6,react:.85,dmg:.6,cdA:.9,cdB:.7,flee:0,gad:false,bush:false,lv:1},
  {n:'Normal',aim:.35,react:.45,dmg:.8,cdA:.5,cdB:.45,flee:.3,gad:true,bush:false,lv:2},
  {n:'Difícil',aim:.16,react:.25,dmg:1,cdA:.3,cdB:.3,flee:.4,gad:true,bush:true,lv:4}];
const THEMES={
  desierto:{n:'Desierto',fa:'#e3c98f',fb:'#dbbf82',wd:'#7a5233',wt:'#c08a5a',wh:'#d9a372',ba:'#2b8a3e',bb:'#40b552',walls:10,bushes:8,sp:0,spn:0},
  jungla:{n:'Jungla',fa:'#9ccc65',fb:'#8fc05a',wd:'#4e342e',wt:'#8d6e63',wh:'#a1887f',ba:'#1b6e2e',bb:'#2e8b3e',walls:7,bushes:16,sp:0,spn:0},
  nieve:{n:'Nieve',fa:'#eef6fb',fb:'#e1edf5',wd:'#4f6f90',wt:'#9cc3e6',wh:'#d4ecff',ba:'#2f6b4f',bb:'#4f8f6f',walls:9,bushes:6,sp:4,spn:7},
  volcan:{n:'Volcán',fa:'#5d4b4b',fb:'#544343',wd:'#241a1a',wt:'#6d5858',wh:'#8a7070',ba:'#4a6b2a',bb:'#6b8f3a',walls:10,bushes:6,sp:5,spn:3}};
const MAPS=Object.keys(THEMES);
const ACH=[
  ['win1','Primera victoria','Gana una partida de Todos contra todos'],
  ['kills3','Triple chispazo','Elimina a 3 rivales en una partida'],
  ['cubes8','Cubo-coleccionista','Consigue 8 cubos en una partida'],
  ['intocable','Intocable','Gana sin bajar de la mitad de vida'],
  ['gems','Cazagemas','Gana una partida de Cazagemas'],
  ['leyenda','Leyenda','Gana Todos contra todos en Difícil'],
  ['maestro','Maestro de la arena','Gana con los 4 personajes'],
  ['super','Superpoderes','Usa 25 súper en total'],
  ['gadget','Truco bajo la manga','Usa 20 trucos en total'],
  ['explorador','Explorador','Juega en los 4 mapas'],
  ['nivel5','Subiendo de nivel','Lleva un personaje al nivel 5'],
  ['duo','Dúo dinámico','Juega una partida a 2 jugadores']];

// ================= guardado =================
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cfg=Object.assign({mode:'solo',players:1,diff:1,map:'random',sel:['brasa','pincho'],music:true,sfx:true},store.get('chz_cfg',{}));
const prof=Object.assign({tro:{},wins:{},ach:{},sup:0,gad:0,maps:{}},store.get('chz_prof',{}));
const saveCfg=()=>store.set('chz_cfg',cfg),saveProf=()=>store.set('chz_prof',prof);
const lvlOf=c=>Math.min(10,1+Math.floor((prof.tro[c]||0)/25));

// ================= sonido y música =================
let AC=null,musGain=null,musTimer=null,musNext=0,musStep=0;
function audioInit(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();musGain=AC.createGain();musGain.gain.value=.045;musGain.connect(AC.destination);}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();}
function tone(f,d,type,v,f2,when,dest){const t=when||AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.06,t);
  g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(dest||AC.destination);o.start(t);o.stop(t+d+.02);}
function snd(f,d,type,v,f2){if(!AC||!cfg.sfx)return;tone(f,d,type,v,f2);}
function jingle(notes,step,type){if(!AC||!cfg.sfx)return;notes.forEach((n,i)=>tone(220*2**(n/12),step*1.6,type||'square',.07,0,AC.currentTime+i*step));}
const MEL=[12,null,15,12,17,null,15,12, 10,null,12,10,7,null,5,7, 12,null,15,17,19,null,17,15, 12,null,10,12,15,null,null,null,
           17,null,15,17,19,null,17,15, 12,null,15,12,10,null,7,10, 12,15,17,15,12,null,10,7, 5,null,7,null,12,null,null,null];
const BAS=[0,0,-4,-4,-7,-7,-2,-2, 0,0,-4,-4,-7,-7,-5,-5];
function musStart(){if(!AC||!cfg.music||musTimer)return;musNext=AC.currentTime+.08;
  musTimer=setInterval(()=>{if(!AC)return;while(musNext<AC.currentTime+.18){const s=musStep,m=MEL[s%64];
    if(m!=null)tone(220*2**(m/12),.12,'square',.5,0,musNext,musGain);
    if(s%2===0)tone(110*2**(BAS[(s>>2)%16]/12),.22,'triangle',.9,0,musNext,musGain);
    if(s%4===0)tone(140,.09,'sine',1,45,musNext,musGain);
    musNext+=.14;musStep++;}},40);}
function musStop(){if(musTimer){clearInterval(musTimer);musTimer=null;}}

// ================= mapa =================
let grid,crates,TH=THEMES.desierto;
const tileAt=(tx,ty)=>(tx<0||ty<0||tx>=MW||ty>=MH)?1:grid[ty*MW+tx];
const tileOf=(x,y)=>tileAt(Math.floor(x/T),Math.floor(y/T));
const solid=(tx,ty)=>{const v=tileAt(tx,ty);return v===1||v===3;};
const tc=(tx,ty)=>({tx,ty,x:tx*T+T/2,y:ty*T+T/2});
function soloSpawns(){const a=[];for(let i=0;i<6;i++){const g=PI/6+i*PI/3;a.push(tc(Math.floor(MW/2+Math.cos(g)*11.5),Math.floor(MH/2+Math.sin(g)*11.5)));}return a;}
function gemSpawns(){const a=[[3,12],[2,16],[3,19]].map(([x,y])=>tc(x,y));return a.concat(a.map(s=>tc(MW-1-s.tx,s.ty)));}
function genMap(mode,th){
  const sp=mode==='gems'?gemSpawns():soloSpawns(),half=MW/2;
  for(let tries=0;tries<50;tries++){
    grid=new Uint8Array(MW*MH);crates=new Map();
    const put=(x,y,v,force)=>{for(const[a,b]of[[x,y],[MW-1-x,y],[x,MH-1-y],[MW-1-x,MH-1-y]]){
      if(a<1||b<1||a>=MW-1||b>=MH-1)continue;const i=b*MW+a;if(force||grid[i]===0)grid[i]=v;}};
    for(let i=0;i<th.walls;i++){const x=2+rnd(half-3),y=2+rnd(half-3),s=rnd(4);
      if(s===0)for(let k=0;k<3;k++)put(x+k,y,1,1);else if(s===1)for(let k=0;k<3;k++)put(x,y+k,1,1);
      else if(s===2){put(x,y,1,1);put(x+1,y,1,1);put(x,y+1,1,1);put(x+1,y+1,1,1);}else{put(x,y,1,1);put(x+1,y,1,1);put(x,y+1,1,1);}}
    for(let i=0;i<th.bushes;i++){const cx=2+rnd(half-2),cy=2+rnd(half-2),n=4+rnd(5);for(let k=0;k<n;k++)put(cx+rnd(3)-1,cy+rnd(3)-1,2);}
    for(let i=0;i<th.spn;i++){const cx=2+rnd(half-3),cy=2+rnd(half-3),w=th.sp===5?rnd(2):1+rnd(3),h=th.sp===5?rnd(2):1+rnd(2);for(let y=0;y<=h;y++)for(let x=0;x<=w;x++)put(cx+x,cy+y,th.sp);}
    for(let i=0;i<5;i++)put(2+rnd(half-2),2+rnd(half-2),3);
    put(4+rnd(half-6),4+rnd(half-6),6);
    for(let x=0;x<MW;x++){grid[x]=1;grid[(MH-1)*MW+x]=1;}for(let y=0;y<MH;y++){grid[y*MW]=1;grid[y*MW+MW-1]=1;}
    const clr=(x,y)=>{if(x>0&&y>0&&x<MW-1&&y<MH-1)grid[y*MW+x]=0;};
    for(const s of sp)for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const v=tileAt(s.tx+dx,s.ty+dy);if(Math.abs(dx)<=1&&Math.abs(dy)<=1||v===5)clr(s.tx+dx,s.ty+dy);}
    if(mode==='gems'){for(let y=11;y<=20;y++)for(let x=1;x<=5;x++){clr(x,y);clr(MW-1-x,y);}}
    const cr=mode==='gems'?2:1;for(let dy=-cr;dy<=cr-1;dy++)for(let dx=-cr;dx<=cr-1;dx++)clr(MW/2+dx,MH/2+dy);
    const seen=new Uint8Array(MW*MH),st=[(MH/2)*MW+MW/2];seen[st[0]]=1;
    while(st.length){const i=st.pop(),x=i%MW,y=(i/MW)|0;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const j=(y+dy)*MW+x+dx;
      if(!seen[j]&&grid[j]!==1){seen[j]=1;st.push(j);}}}
    if(!sp.every(s=>seen[s.ty*MW+s.tx]))continue;
    for(let i=0;i<grid.length;i++)if(!seen[i])grid[i]=1;
    for(let i=0;i<grid.length;i++){if(grid[i]===3)crates.set(i,{hp:1600,max:1600,gold:false});
      else if(grid[i]===6){grid[i]=3;crates.set(i,{hp:3200,max:3200,gold:true});}}
    return sp;
  }
  return sp;
}
function collide(f){const r=f.r;
  for(let pass=0;pass<2;pass++){
    const x0=Math.floor((f.x-r)/T),x1=Math.floor((f.x+r)/T),y0=Math.floor((f.y-r)/T),y1=Math.floor((f.y+r)/T);
    for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){if(!solid(tx,ty))continue;
      const cx=clamp(f.x,tx*T,tx*T+T),cy=clamp(f.y,ty*T,ty*T+T);const dx=f.x-cx,dy=f.y-cy,d2=dx*dx+dy*dy;
      if(d2<r*r){if(d2<.01){f.y=ty*T-r;continue;}const d=Math.sqrt(d2);f.x+=dx/d*(r-d);f.y+=dy/d*(r-d);}}}}
function los(ax,ay,bx,by,ignore){const d=hyp(bx-ax,by-ay),n=Math.ceil(d/12);
  for(let i=1;i<n;i++){const tx=Math.floor((ax+(bx-ax)*i/n)/T),ty=Math.floor((ay+(by-ay)*i/n)/T);
    if(solid(tx,ty))return ignore!==undefined&&ty*MW+tx===ignore;}return true;}
const inBush=f=>tileOf(f.x,f.y)===2;

// ================= estado =================
let G=null;
const cams=[{x:0,y:0},{x:0,y:0}];
function mkF(c,name,sp,id,team,pi,lv){const ch=CHARS[c],m=1+.04*(lv-1);
  return{id,c,ch,name,team,pi,lv,x:sp.x,y:sp.y,sx:sp.x,sy:sp.y,r:22,hp:ch.hp*m,maxHp:ch.hp*m,lvMul:m,ammo:3,cd:0,sup:0,cubes:0,dmgMul:1,
    face:sp.x>WW/2?PI:0,mvA:sp.x>WW/2?PI:0,vx:0,vy:0,lastHurt:-9,lastAttack:-9,dead:false,kills:0,pend:[],slow:0,gasT:0,lavaT:0,
    gad:2,gadCd:0,shield:0,speedT:0,dashT:0,dashA:0,gems:0,resp:0,prot:0,minHp:1,supUsed:0,gadUsed:0,place:0,supReady:false,
    ai:{think:0,tgt:null,aimDelay:0,detour:0,detA:0,stuckT:0,lx:sp.x,ly:sp.y,wander:null,goal:null,flee:false}};}
function newGame(){
  const th=cfg.map==='random'?MAPS[rnd(MAPS.length)]:cfg.map;TH=THEMES[th];
  const sp=genMap(cfg.mode,TH),D=DIFF[cfg.diff],nH=cfg.players;
  G={mode:cfg.mode,th,D,nH,t:0,start:2.4,fighters:[],humans:[],bullets:[],lobs:[],puddles:[],turrets:[],picks:[],items:[],gems:[],
     parts:[],texts:[],feed:[],safe:WW*2,endT:-1,over:false,paused:false,shake:[0,0],itemT:7,mineT:2,cd:{team:-1,t:15,last:15},winner:-1};
  const names=shuffle(BOTN);let id=0;
  const human=i=>{const h=mkF(cfg.sel[i],nH===1?'TÚ':'J'+(i+1),null,0,0,i,lvlOf(cfg.sel[i]));return h;};

function moveF(f,mx,my,dt){let l=hyp(mx,my);if(l>1){mx/=l;my/=l;l=1;}
  const sp=f.ch.spd*(f.slow>0?.6:1)*(f.speedT>0?1.5:1);let dx=mx*sp,dy=my*sp;
  if(f.dashT>0){dx=Math.cos(f.dashA)*900;dy=Math.sin(f.dashA)*900;}
  else if(tileOf(f.x,f.y)===4){const k=Math.min(1,dt*2.2);dx=f.vx+(dx-f.vx)*k;dy=f.vy+(dy-f.vy)*k;}

function randomFloor(inSafe){for(let i=0;i<40;i++){const tx=1+rnd(MW-2),ty=1+rnd(MH-2);if(grid[ty*MW+tx]!==0)continue;const p=tc(tx,ty);
  if(inSafe&&G.mode==='solo'&&(Math.abs(p.x-WW/2)>G.safe-T*2||Math.abs(p.y-WH/2)>G.safe-T*2))continue;return p;}return{x:WW/2,y:WH/2};}
function nearestTile(b,type,maxD){let best=null,bd=maxD;const r=Math.ceil(maxD/T),bx=Math.floor(b.x/T),by=Math.floor(b.y/T);
  for(let y=by-r;y<=by+r;y++)for(let x=bx-r;x<=bx+r;x++){if(tileAt(x,y)!==type)continue;const p=tc(x,y),d=hyp(p.x-b.x,p.y-b.y);if(d<bd){bd=d;best=p;}}return best;}
function botAI(b,dt){
  const a=b.ai,t=G.t,D=G.D,gm=G.mode==='gems';a.think-=dt;a.aimDelay-=dt;
  if(a.tgt&&a.tgt.dead)a.tgt=null;
  const tot=gm?teamGems(b.team):0,carrier=gm&&b.gems>0&&(tot>=10||(b.gems>=4&&b.hp<b.maxHp*.5));
  if(a.think<=0){
    a.think=.2+Math.random()*.2;let best=null,bd=1e9;
    for(const f of G.fighters){if(f.team===b.team||f.dead)continue;const d=hyp(f.x-b.x,f.y-b.y);if(d<680&&d<bd&&visible(b,f)){best=f;bd=d;}}
    for(const tu of G.turrets){if(tu.team===b.team||tu.dead)continue;const d=hyp(tu.x-b.x,tu.y-b.y);if(d<420&&d<bd){best=tu;bd=d;}}
    if(best&&best!==a.tgt)a.aimDelay=D.react*(.7+Math.random()*.6);a.tgt=best;a.goal=null;
    let it=null,id=350;for(const p of G.items){const d=hyp(p.x-b.x,p.y-b.y);if(d<id&&(p.k==='speed'||b.hp<b.maxHp*.8)){id=d;it=p;}}
    if(gm){
      if(carrier)a.goal={x:b.sx,y:b.sy,k:'home'};
      else if(it&&!best)a.goal={x:it.x,y:it.y,k:'item'};
      else{let g=null,gd=1e9;for(const q of G.gems){const d=hyp(q.x-b.x,q.y-b.y);if(d<gd){gd=d;g=q;}}
        a.goal=g?{x:g.x,y:g.y,k:'gem'}:{x:WW/2+Math.cos(b.id*1.7)*90,y:WH/2+Math.sin(b.id*1.7)*90,k:'mine'};}
    }else if(!best){
      let pk=null,pd=520;for(const p of G.picks){const d=hyp(p.x-b.x,p.y-b.y);if(d<pd){pd=d;pk=p;}}
      if(it)a.goal={x:it.x,y:it.y,k:'item'};
      else if(pk)a.goal={x:pk.x,y:pk.y,k:'pick'};
      else{let cb=null,cd=560;for(const i of crates.keys()){const x=(i%MW)*T+T/2,y=((i/MW)|0)*T+T/2,d=hyp(x-b.x,y-b.y);if(d<cd){cd=d;cb={x,y,i};}}
        const bush=D.bush&&b.hp<b.maxHp*.85?nearestTile(b,2,320):null;
        if(bush)a.goal={x:bush.x,y:bush.y,k:'bush'};
        else if(cb)a.goal={x:cb.x,y:cb.y,i:cb.i,k:'crate'};
        else{if(!a.wander||hyp(a.wander.x-b.x,a.wander.y-b.y)<60||Math.random()<.02)a.wander=randomFloor(true);a.goal={x:a.wander.x,y:a.wander.y,k:'w'};}}
    }
  }
  let mx=0,my=0;const tg=a.tgt;a.flee=false;
  const toward=(x,y,minD)=>{const dx=x-b.x,dy=y-b.y,d=hyp(dx,dy)||1;if(d>(minD||16)){mx=dx/d;my=dy/d;}};
  if(tg&&!(carrier&&hyp(tg.x-b.x,tg.y-b.y)>260)){const dx=tg.x-b.x,dy=tg.y-b.y,d=hyp(dx,dy)||1,pref=b.ch.rng*.65;
    if((b.hp<b.maxHp*D.flee&&b.sup<1)||carrier){a.flee=true;if(gm)toward(b.sx,b.sy);else{mx=-dx/d;my=-dy/d;}}
    else{const k=d>pref+40?1:d<pref-60?-1:0;mx=dx/d*k;my=dy/d*k;const s=Math.sin(t*1.3+b.id*2)>0?1:-1;mx+=-dy/d*.7*s;my+=dx/d*.7*s;}
  }else if(a.goal){if(a.goal.k==='crate'){if(hyp(a.goal.x-b.x,a.goal.y-b.y)>b.ch.rng*.6)toward(a.goal.x,a.goal.y);}else toward(a.goal.x,a.goal.y,a.goal.k==='home'?30:16);}
  if(G.mode==='solo'){const s=G.safe-T*1.3;if(Math.abs(b.x-WW/2)>s||Math.abs(b.y-WH/2)>s){mx=0;my=0;toward(WW/2,WH/2);}}
  if((mx||my)&&tileAt(Math.floor((b.x+mx*40)/T),Math.floor((b.y+my*40)/T))===5){const s=b.id%2?1:-1;[mx,my]=[-my*s,mx*s];}
  if(a.detour>0){a.detour-=dt;mx=Math.cos(a.detA);my=Math.sin(a.detA);}
  moveF(b,mx,my,dt);
  a.stuckT+=dt;if(a.stuckT>.5){if(hyp(b.x-a.lx,b.y-a.ly)<18&&hyp(mx,my)>.3){a.detour=.45+Math.random()*.4;a.detA=Math.random()*PI*2;}a.stuckT=0;a.lx=b.x;a.ly=b.y;}
  // trucos
  if(D.gad&&b.gad>0&&b.gadCd<=0&&G.t>G.start){const d=tg?hyp(tg.x-b.x,tg.y-b.y):1e9,hp=b.hp/b.maxHp;let use=false;
    if(b.c==='brasa')use=tg&&d<320&&hp<.6;else if(b.c==='pincho')use=hp<.45;
    else if(b.c==='tuerca')use=(a.flee&&hp<.4)||(tg&&d>b.ch.rng&&d<600&&hp>.6&&!gm);else use=a.flee||(tg&&d>b.ch.rng*1.2&&d<600);
    if(use){gadgetF(b);b.gadCd=6;}}
  // disparar
  if(tg&&a.aimDelay<=0){
    const d=hyp(tg.x-b.x,tg.y-b.y),lobber=b.c==='gota',lead=d/b.ch.spdB*.7;
    const px=tg.x+(tg.vx||0)*lead,py=tg.y+(tg.vy||0)*lead;const ang=Math.atan2(py-b.y,px-b.x)+(Math.random()-.5)*D.aim;
    const sr=b.c==='brasa'?220:b.c==='tuerca'?450:b.c==='gota'?370:560;

    if(tu.dead||tu.t>tu.life){if(!tu.dead)burst(tu.x,tu.y,'#9ab',12,150);G.turrets.splice(i,1);continue;}

      if(G.cd.t<=0){G.winner=lead;G.endT=G.t+1.5;}}}

function show(id){for(const s of['menu','pause','achs','end'])$(s).classList.toggle('hide',s!==id);}
function startGame(){audioInit();show(null);newGame();}
$('play').onclick=()=>{try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{});}catch(e){}startGame();};
$('again').onclick=startGame;
$('change').onclick=()=>{G=null;musStop();show('menu');buildMenu();};
$('quit').onclick=()=>{G=null;musStop();show('menu');buildMenu();};
$('resume').onclick=()=>setPause(false);
function setPause(v){if(!G||G.over)return;G.paused=v;resetCtl();show(v?'pause':null);if(v)musStop();else musStart();}
$('bAch').onclick=()=>{$('achList').innerHTML=ACH.map(([id,n,d])=>`<div class="ach${prof.ach[id]?' got':''}">${prof.ach[id]?'🏅':'🔒'} ${n}<small>${d}</small></div>`).join('');show('achs');};
$('achBack').onclick=()=>show('menu');
function showEnd(){
  G.over=true;musStop();resetCtl();const solo=G.mode==='solo',lines=[],newA=[];
  const trophyFor=h=>solo?[10,8,6,4,2,1][(h.place||6)-1]+(cfg.diff===2?3:0):(G.winner===h.team?8:2)+(cfg.diff===2&&G.winner===h.team?3:0);
  for(const h of G.humans){
    const won=solo?h.place===1:G.winner===h.team,before=lvlOf(h.c),tr=trophyFor(h);
    prof.tro[h.c]=(prof.tro[h.c]||0)+tr;prof.sup+=h.supUsed;prof.gad+=h.gadUsed;if(won){prof.wins[h.c]=(prof.wins[h.c]||0)+1;}
    const after=lvlOf(h.c),who=G.nH===2?`${h.name} (${CHARS[h.c].name})`:CHARS[h.c].name;
    lines.push(`${who}: ${solo?`puesto ${h.place||'?'}º`:won?'victoria':'derrota'} · ✖ ${h.kills} ${solo?`· ⬢ ${h.cubes}`:''} · <b class="new">+${tr} 🏆</b>`+(after>before?` · <b class="new">¡Sube a nivel ${after}!</b>`:''));
    const got=id=>{if(!prof.ach[id]){prof.ach[id]=true;newA.push(ACH.find(a=>a[0]===id)[1]);}};
    if(solo&&won)got('win1');if(h.kills>=3)got('kills3');if(h.cubes>=8)got('cubes8');if(solo&&won&&h.minHp>=.5)got('intocable');
    if(!solo&&won)got('gems');if(solo&&won&&cfg.diff===2)got('leyenda');if(CKEYS.every(c=>prof.wins[c]))got('maestro');
    if(prof.sup>=25)got('super');if(prof.gad>=20)got('gadget');if(MAPS.every(m=>prof.maps[m]))got('explorador');if(CKEYS.some(c=>lvlOf(c)>=5))got('nivel5');if(G.nH===2)got('duo');
  }
  saveProf();
  let title;
  if(G.nH===1){const h=G.humans[0];title=solo?(h.place===1?'🏆 ¡GANASTE!':`Puesto ${h.place}º`):(G.winner===h.team?'🏆 ¡VICTORIA!':'DERROTA');}
  else if(solo){const [a,b]=G.humans;const best=(a.place||9)<(b.place||9)?a:b;title=best.place===1?`🏆 ¡Gana ${best.name}!`:`${best.name} llega más lejos`;}
  else title=`🏆 ¡Gana ${G.humans.find(h=>h.team===G.winner).name}!`;
  const won=G.humans.some(h=>solo?h.place===1:G.winner===h.team);jingle(won?[0,4,7,12,16,19,24]:[12,7,4,0,-5],won?.1:.16,won?'square':'triangle');
  $('endT').textContent=title;
  $('endS').innerHTML=lines.join('<br>')+(newA.length?`<br><span class="new">🏅 Nuevo logro: ${newA.join(', ')}</span>`:'')+`<br><small>${THEMES[G.th].n} · Robots ${G.D.n}</small>`;
  show('end');}
buildMenu();
document.fonts&&document.fonts.ready.then(buildMenu);

// gancho para pruebas
window.__game={step(n){for(let i=0;i<n;i++)update(DT);draw();},get G(){return G},start(o){Object.assign(cfg,o||{});startGame();},cfg,prof};
</script>
</body>
</html>
